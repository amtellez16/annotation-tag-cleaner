<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVAnnotate Tag Cleaner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #F5F3EF;
      color: #1C1C1C;
      min-height: 100vh;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CCC; border-radius: 3px; }
    input:focus { outline: 2px solid #C8860A; outline-offset: 1px; }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;
 
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const BRAND       = '#C8860A';
const BRAND_DARK  = '#8B5E08';
const BRAND_LIGHT = '#FEF6E6';
 
// Master sheet columns (0-indexed)
const MASTER_GROUP_COL = 0; // Column A
const MASTER_TAG_COL   = 1; // Column B
 
// Content sheets tag column (0-indexed, P = 15)
const DEFAULT_TAG_COL  = 15;
 
// ─── UTILITIES ───────────────────────────────────────────────────────────────
function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const dp = Array.from({length: b.length + 1}, (_, i) =>
    Array.from({length: a.length + 1}, (_, j) => i === 0 ? j : j === 0 ? i : 0)
  );
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      dp[i][j] = b[i-1] === a[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i][j-1], dp[i-1][j]);
    }
  }
  return dp[b.length][a.length];
}
 
// Normalize: lowercase, trim, collapse dashes/underscores to spaces
function normalize(tag) {
  return tag.toLowerCase().trim().replace(/[-_]+/g, ' ').replace(/\s+/g, ' ');
}
 
// URL safety: allow letters (incl. accented), digits, spaces, dashes
function isURLSafe(tag) {
  return !/[^a-zA-Z\u00C0-\u024F0-9\s\-]/.test(tag);
}
function getUnsafeChars(tag) {
  const m = tag.match(/[^a-zA-Z\u00C0-\u024F0-9\s\-]/g);
  return m ? [...new Set(m)] : [];
}
 
// Extended trim: removes ASCII whitespace + invisible Unicode chars (NBSP, BOM, zero-width spaces)
// that JavaScript's built-in .trim() misses. These are very common in Excel/Word-sourced data.
function deepTrim(s) {
  return String(s).replace(/^[\s\u00A0\u200B\u200C\u200D\uFEFF]+|[\s\u00A0\u200B\u200C\u200D\uFEFF]+$/g, '');
}
 
function parseTags(cell) {
  if (cell === null || cell === undefined || cell === '') return [];
  return String(cell).split('|').map(deepTrim).filter(Boolean);
}
 
async function readCSV(file) {
  const ext = file.name.split('.').pop().toLowerCase();
 
  // Excel: use SheetJS
  if (ext === 'xlsx' || ext === 'xls') {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const workbook = XLSX.read(e.target.result, { type: 'array' });
          // Use the first sheet
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          // Convert to 2D array (header: 1 = raw array of arrays)
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          resolve(rows);
        } catch (err) { reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
 
  // TSV: PapaParse with tab delimiter
  if (ext === 'tsv') {
    return new Promise((resolve, reject) => {
      Papa.parse(file, {
        delimiter: '\t',
        complete: r => resolve(r.data),
        error: e => reject(e),
        skipEmptyLines: false,
      });
    });
  }
 
  // CSV (default): PapaParse with auto-detect
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      complete: r => resolve(r.data),
      error: e => reject(e),
      skipEmptyLines: false,
    });
  });
}
 
// Extract canonical tags from master sheet: col A = group, col B = tag
function parseMasterSheet(rows) {
  const tags   = new Map(); // tag -> group
  const groups = new Set();
  rows.forEach((row, i) => {
    if (i === 0) return; // skip header
    const group = (row[MASTER_GROUP_COL] || '').trim();
    const tag   = (row[MASTER_TAG_COL]   || '').trim();
    if (tag) {
      tags.set(tag, group);
      if (group) groups.add(group);
    }
  });
  return { tags, groups: [...groups].sort() };
}
 
// Extract pipe-separated tags from content sheet column P
function parseContentSheet(rows, colIdx) {
  const map = new Map(); // tag -> rowIndices[]
  rows.forEach((row, i) => {
    if (i === 0) return;
    parseTags(row[colIdx] || '').forEach(tag => {
      if (!map.has(tag)) map.set(tag, []);
      map.get(tag).push(i);
    });
  });
  return map;
}
 
// ── DUPLICATES & WHITESPACE ANALYSIS ─────────────────────────────────────────
 
// Find rows with duplicate tags within the same cell
function findDuplicateRows(contentFiles, colIdx) {
  const results = []; // { fileName, fileIndex, rowIndex, original, deduped, dupes }
  contentFiles.forEach((file, fi) => {
    file.rows.forEach((row, ri) => {
      if (ri === 0) return;
      const cell = row[colIdx] || '';
      const tags = cell.split('|').map(t => t.trim()).filter(Boolean);
      const seen = new Set(), dupes = new Set();
      tags.forEach(t => { if (seen.has(t)) dupes.add(t); else seen.add(t); });
      if (dupes.size > 0) {
        const deduped = [...new Set(tags)];
        results.push({ fileName: file.name, fileIndex: fi, rowIndex: ri, original: tags, deduped, dupes: [...dupes] });
      }
    });
  });
  return results;
}
 
// Find tags with genuine whitespace problems — NOT the normal spaces around "|" separators.
// Flags: non-breaking spaces (U+00A0), tabs, zero-width chars, multiple consecutive spaces.
// A cell like "Mexico | Panama | California" is perfectly fine and will NOT be flagged.
function findWhitespaceTags(contentFiles, colIdx) {
  const PROBLEM_RE   = /\u00A0|\t|\u200B|\u200C|\u200D|\uFEFF|  /; // NBSP, tab, ZW-chars, double-space
  const found = new Map(); // tag -> [{ fileName, rowIndex }]
  contentFiles.forEach((file, fi) => {
    file.rows.forEach((row, ri) => {
      if (ri === 0) return;
      const cell = row[colIdx] || '';
      parseTags(cell).forEach(tag => {
        if (PROBLEM_RE.test(tag)) {
          if (!found.has(tag)) found.set(tag, []);
          found.get(tag).push({ fileName: file.name, fileIndex: fi, rowIndex: ri });
        }
      });
    });
  });
  const clean = s => s.replace(/\u00A0/g, ' ')
                       .replace(/[\t\u200B\u200C\u200D\uFEFF]/g, '')
                       .replace(/  +/g, ' ')
                       .trim();
  return [...found.entries()].map(([raw, occurrences]) => ({ raw, trimmed: clean(raw), occurrences }));
}
 
// ── PHONETIC HELPERS ─────────────────────────────────────────────────────────
 
// Simplified Soundex: converts a word to a 4-char phonetic code.
// "Beagle" → "B240",  "Begel" → "B240"  ✓
// "Debra"  → "D160",  "Deborah" → "D160" ✓
function soundex(word) {
  const map = {
    b:1,f:1,p:1,v:1,
    c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2,
    d:3,t:3, l:4, m:5,n:5, r:6
  };
  const w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return '';
  let code = w[0].toUpperCase();
  let prev = map[w[0]] || 0;
  for (let i = 1; i < w.length; i++) {
    const c = map[w[i]];
    if (c && c !== prev) { code += c; if (code.length === 4) break; prev = c; }
    else if (!c) prev = 0; // vowel / H / W resets the run
  }
  return code.padEnd(4, '0');
}
 
// Phonetic key for a whole tag: soundex each word token, sort, join.
// "Beagle, Debra" and "Begel, Deborah" both → "B240|D160"
function phoneticKey(tag) {
  const words = tag.toLowerCase()
    .replace(/[^a-z\s]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length > 1);
  if (!words.length) return '';
  return words.map(soundex).sort().join('|');
}
 
// Returns true when two normalized tags share the same alphabetic skeleton
// but differ only in their numeric runs — i.e. different dates or episode numbers.
// "march 15 2024" vs "march 22 2024" → true  (don't group!)
function isNumericVariant(a, b) {
  if (a === b) return false;
  const skeleton = s => s.replace(/\d+/g, '\x01');
  return skeleton(a) === skeleton(b);
}
 
// ── BUILD VARIATION GROUPS ────────────────────────────────────────────────────
// Three-pass approach:
//   Pass 1 – normalization  (catches case / space / dash differences)
//   Pass 2 – Levenshtein    (catches small typos), skipping numeric-only variants
//   Pass 3 – Soundex        (catches phonetic name misspellings like Beagle/Begel)
function buildVariationGroups(tags) {
  const byNorm = new Map();
  tags.forEach(tag => {
    const n = normalize(tag);
    if (!byNorm.has(n)) byNorm.set(n, []);
    byNorm.get(n).push(tag);
  });
 
  const normKeys = [...byNorm.keys()];
  const parentOf = new Map();
  normKeys.forEach(n => parentOf.set(n, n));
 
  function find(n) {
    if (parentOf.get(n) !== n) parentOf.set(n, find(parentOf.get(n)));
    return parentOf.get(n);
  }
  function union(a, b) {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parentOf.set(rb, ra);
  }
 
  // Pass 2: Levenshtein — only compare tags that share the same first character
  // Reduces comparisons ~26x (O(n²) → O(n²/26)), keeping Firefox responsive.
  const byFirstChar = new Map();
  normKeys.forEach(n => {
    const fc = n[0] || '';
    if (!byFirstChar.has(fc)) byFirstChar.set(fc, []);
    byFirstChar.get(fc).push(n);
  });
  byFirstChar.forEach(group => {
    for (let i = 0; i < group.length; i++) {
      for (let j = i + 1; j < group.length; j++) {
        const a = group[i], b = group[j];
        if (isNumericVariant(a, b)) continue;          // ← date / episode guard
        const threshold = Math.max(1, Math.floor(Math.min(a.length, b.length) / 7));
        if (levenshtein(a, b) <= threshold) union(a, b);
      }
    }
  });
 
  // Pass 3: Soundex — group norm keys whose tokens sound the same
  const byPhonetic = new Map();
  normKeys.forEach(n => {
    // Only apply phonetic matching to tags that look like names / words
    // (skip purely numeric or very short tags to avoid false positives)
    const hasLetters = /[a-z]{2,}/i.test(n);
    if (!hasLetters) return;
    const pk = phoneticKey(n);
    if (!pk || pk.length < 4) return; // too short → too many collisions
    if (!byPhonetic.has(pk)) byPhonetic.set(pk, []);
    byPhonetic.get(pk).push(n);
  });
  byPhonetic.forEach(norms => {
    // Extra guard: don't phonetically merge tags that differ only in numbers
    const filtered = norms.filter((n, _, arr) =>
      arr.some(other => other !== n && !isNumericVariant(n, other))
    );
    for (let i = 1; i < filtered.length; i++) union(filtered[0], filtered[i]);
  });
 
  // Collect final groups
  const grouped = new Map();
  normKeys.forEach(n => {
    const root = find(n);
    if (!grouped.has(root)) grouped.set(root, []);
    byNorm.get(n).forEach(tag => grouped.get(root).push(tag));
  });
 
  return [...grouped.entries()]
    .filter(([, v]) => v.length > 1)
    .map(([id, variants]) => {
      const deduped = [...new Set(variants)].sort();
      // Label the match reason for display
      let reason = 'normalized';
      if (deduped.length > 1) {
        const norms = deduped.map(normalize);
        const allSameNorm = norms.every(n => n === norms[0]);
        if (!allSameNorm) {
          // Check phonetic
          const keys = deduped.map(t => phoneticKey(normalize(t)));
          const allSamePhonetic = keys.every(k => k === keys[0]);
          reason = allSamePhonetic ? 'phonetic (sounds alike)' : 'spelling (edit distance)';
        }
      }
      return { id, variants: deduped, reason };
    })
    .sort((a, b) => b.variants.length - a.variants.length);
}
 
// Apply a replacements map to a sheet's rows
// Sentinel used to mark a tag for full deletion
const DELETE_SENTINEL = '\x00DELETE\x00';
 
function applyReplacements(rows, colIdx, replacements) {
  return rows.map((row, i) => {
    if (i === 0) return row;
    const tags = parseTags(row[colIdx] || '');
    if (!tags.length) return row;
    const updated = [...new Set(
      tags
        .map(t => replacements.has(t) ? replacements.get(t) : t)
        .filter(t => t !== DELETE_SENTINEL)           // remove deleted tags
    )];
    const newRow = [...row];
    newRow[colIdx] = updated.join(' | ');
    return newRow;
  });
}
 
// ─── STYLE HELPERS ───────────────────────────────────────────────────────────
const S = {
  card: {
    background: '#FFF',
    borderRadius: 12,
    padding: '22px 24px',
    boxShadow: '0 1px 4px rgba(0,0,0,.07)',
    marginBottom: 18,
    border: '1px solid #ECEAE6',
  },
  btn: (v = 'primary') => ({
    display: 'inline-flex', alignItems: 'center', gap: 5,
    padding: '8px 14px', borderRadius: 7, fontSize: 13, fontWeight: 600,
    cursor: 'pointer', border: 'none', transition: 'opacity .15s',
    background: v === 'primary' ? BRAND : v === 'danger' ? '#FFF0F0' : v === 'ghost' ? 'transparent' : '#F0F0F0',
    color:      v === 'primary' ? '#FFF' : v === 'danger' ? '#C62828' : '#444',
  }),
  input: {
    border: '1px solid #DDD', borderRadius: 7, padding: '7px 11px',
    fontSize: 13, width: '100%', fontFamily: 'inherit', background: '#FFF',
  },
  badge: (c = 'gray') => {
    const map = {
      green:  ['#E8F5E9','#2E7D32'],  red:    ['#FFEBEE','#C62828'],
      yellow: ['#FFF8E1','#E65100'],  blue:   ['#E3F2FD','#1565C0'],
      purple: ['#F3E5F5','#6A1B9A'],  gray:   ['#F5F5F5','#555'],
      orange: [BRAND_LIGHT, BRAND_DARK], teal: ['#E0F2F1','#00695C'],
    };
    const [bg, fg] = map[c] || map.gray;
    return { background: bg, color: fg, borderRadius: 5, padding: '2px 8px', fontSize: 11, fontWeight: 600, display: 'inline-block', whiteSpace: 'nowrap' };
  },
};
 
// ─── DROP ZONE ───────────────────────────────────────────────────────────────
function DropZone({ onFiles, multiple, label, sublabel, fileList, accent }) {
  const [over, setOver] = useState(false);
  const ref = useRef(null);
  const color = accent || BRAND;
 
  const ACCEPTED = ['.csv', '.tsv', '.xlsx', '.xls'];
  const handle = fs => {
    const valid = fs.filter(f => ACCEPTED.some(ext => f.name.toLowerCase().endsWith(ext)));
    if (valid.length) onFiles(valid);
  };
 
  return (
    <div
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); handle([...e.dataTransfer.files]); }}
      onClick={() => ref.current?.click()}
      style={{
        border: `2px dashed ${over ? BRAND_DARK : color}`,
        borderRadius: 11, padding: '28px 18px', textAlign: 'center',
        cursor: 'pointer', background: over ? BRAND_LIGHT : '#FAFAF8',
        transition: 'all .2s', userSelect: 'none', minHeight: 140,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      }}
    >
      <input ref={ref} type="file" accept=".csv,.tsv,.xlsx,.xls" multiple={multiple} style={{ display:'none' }}
        onChange={e => { handle([...e.target.files]); e.target.value=''; }} />
      <div style={{ fontSize: 32, marginBottom: 8 }}>📂</div>
      <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 3 }}>{label}</div>
      <div style={{ color: '#888', fontSize: 12 }}>{sublabel}</div>
      {fileList && fileList.length > 0 && (
        <div style={{ marginTop: 12, display: 'flex', flexWrap: 'wrap', gap: 4, justifyContent: 'center' }}>
          {fileList.map((name, i) => (
            <span key={i} style={{ ...S.badge('green'), fontSize: 10 }}>✓ {name}</span>
          ))}
        </div>
      )}
    </div>
  );
}
 
// ─── TAB BAR ─────────────────────────────────────────────────────────────────
function TabBar({ tabs, active, onChange }) {
  return (
    <nav style={{
      display: 'flex', background: '#FFF', borderBottom: '1px solid #E5E3DF',
      padding: '0 24px', overflowX: 'auto',
    }}>
      {tabs.map(t => {
        const on = active === t.id;
        const off = t.enabled === false;
        return (
          <button key={t.id}
            onClick={() => !off && onChange(t.id)}
            style={{
              padding: '13px 16px', border: 'none', background: 'none',
              fontWeight: on ? 700 : 500, fontSize: 13,
              color: off ? '#CCC' : on ? BRAND_DARK : '#555',
              borderBottom: `2px solid ${on ? BRAND : 'transparent'}`,
              cursor: off ? 'not-allowed' : 'pointer', whiteSpace: 'nowrap',
              display: 'flex', alignItems: 'center', gap: 6,
            }}>
            {t.label}
            {t.count != null && (
              <span style={{ ...S.badge(on ? 'orange' : 'gray'), fontSize: 10, padding: '1px 6px' }}>
                {t.count}
              </span>
            )}
          </button>
        );
      })}
    </nav>
  );
}
 
// ─── UPLOAD TAB ──────────────────────────────────────────────────────────────
function UploadTab({ onParsed }) {
  const [masterRaw,     setMasterRaw]     = useState(null);
  const [contentRaw,    setContentRaw]    = useState([]);
  const [colLetter,     setColLetter]     = useState('P');
  const [masterTagCol,  setMasterTagCol]  = useState('B');
  const [masterGrpCol,  setMasterGrpCol]  = useState('A');
  const [hasHeader,     setHasHeader]     = useState(true);
  const [loading,       setLoading]       = useState(false);
  const [error,         setError]         = useState(null);
  // Live preview of master sheet after it's selected
  const [masterPreview,  setMasterPreview]  = useState(null); // { tagCount, groupCount, sample, tagHeader, grpHeader, warning }
  const [contentHeaders, setContentHeaders] = useState(null); // header name at colIdx from first content file
 
  const colIdx = useMemo(() => {
    const l = colLetter.trim().toUpperCase();
    return l.length === 1 && l >= 'A' && l <= 'Z' ? l.charCodeAt(0) - 65 : DEFAULT_TAG_COL;
  }, [colLetter]);
 
  const masterTagColIdx = useMemo(() => {
    const l = masterTagCol.trim().toUpperCase();
    return l.length === 1 && l >= 'A' && l <= 'Z' ? l.charCodeAt(0) - 65 : MASTER_TAG_COL;
  }, [masterTagCol]);
 
  const masterGrpColIdx = useMemo(() => {
    const l = masterGrpCol.trim().toUpperCase();
    return l.length === 1 && l >= 'A' && l <= 'Z' ? l.charCodeAt(0) - 65 : MASTER_GROUP_COL;
  }, [masterGrpCol]);
 
  // Parse master sheet immediately on file selection for instant feedback
  async function previewMaster(file) {
    try {
      const rows = await readCSV(file);
      const headerRow = hasHeader && rows.length > 0 ? rows[0] : null;
      const tagHeader = headerRow ? deepTrim(headerRow[masterTagColIdx] ?? '') : '';
      const grpHeader = headerRow ? deepTrim(headerRow[masterGrpColIdx] ?? '') : '';
      const startRow = hasHeader ? 1 : 0;
      const tags = new Set(), groups = new Set();
      rows.slice(startRow).forEach(row => {
        const tag   = deepTrim(row[masterTagColIdx] ?? '');
        const group = deepTrim(row[masterGrpColIdx] ?? '');
        if (tag) { tags.add(tag); if (group) groups.add(group); }
      });
      const sample = [...tags].slice(0, 5);
      setMasterPreview({
        tagCount:   tags.size,
        groupCount: groups.size,
        sample,
        tagHeader,
        grpHeader,
        warning: tags.size === 0
          ? `No tags found in column ${masterTagCol.toUpperCase()}. Check your column settings below.`
          : null,
      });
    } catch (e) {
      setMasterPreview({ tagCount: 0, groupCount: 0, sample: [], warning: 'Could not read file: ' + e.message });
    }
  }
 
  function handleMasterFiles(fs) {
    const file = fs[0];
    setMasterRaw(file);
    setMasterPreview(null);
    previewMaster(file);
  }
 
  const addContent = fs => {
    setContentRaw(prev => {
      const existing = new Set(prev.map(f => f.name));
      return [...prev, ...fs.filter(f => !existing.has(f.name))];
    });
    // Peek at first file's header row for the tag column
    if (fs[0]) {
      readCSV(fs[0]).then(rows => {
        const hdr = rows[0] ? (rows[0][colIdx] || '').toString().trim() : '';
        setContentHeaders(hdr || null);
      }).catch(() => {});
    }
  };
 
  // Re-preview master when column settings change
  useEffect(() => {
    if (masterRaw) previewMaster(masterRaw);
  }, [masterTagColIdx, masterGrpColIdx, hasHeader]);
 
  // Re-peek content header when column letter changes
  useEffect(() => {
    const first = contentRaw[0];
    if (!first) return;
    readCSV(first).then(rows => {
      const hdr = rows[0] ? (rows[0][colIdx] || '').toString().trim() : '';
      setContentHeaders(hdr || null);
    }).catch(() => {});
  }, [colIdx]);
 
  const handleGo = async () => {
    if (!masterRaw || !contentRaw.length) return;
    setLoading(true); setError(null);
    try {
      const masterRows = await readCSV(masterRaw);
      const startRow   = hasHeader ? 1 : 0;
      const masterTags = new Map(), groupsSet = new Set();
      masterRows.slice(startRow).forEach(row => {
        const tag   = deepTrim(row[masterTagColIdx] ?? '');
        const group = deepTrim(row[masterGrpColIdx] ?? '');
        if (tag) { masterTags.set(tag, group); if (group) groupsSet.add(group); }
      });
 
      if (masterTags.size === 0) {
        setError(`No tags found in master sheet column ${masterTagCol.toUpperCase()}. Double-check the column settings.`);
        setLoading(false); return;
      }
 
      const contentSheets = await Promise.all(contentRaw.map(async f => {
        const rows = await readCSV(f);
        const tags = parseContentSheet(rows, colIdx);
        return { name: f.name, rows, tags };
      }));
 
      onParsed(
        { name: masterRaw.name, rows: masterRows, tags: masterTags, groups: [...groupsSet].sort() },
        contentSheets, colIdx
      );
    } catch (e) {
      setError('Parse error: ' + (e.message || e));
    }
    setLoading(false);
  };
 
  const ready = masterRaw && contentRaw.length > 0 && masterPreview?.tagCount > 0;
 
  return (
    <div style={{ maxWidth: 960, margin: '0 auto', padding: '36px 28px' }}>
      <h1 style={{ fontSize: 24, fontWeight: 800, marginBottom: 6 }}>Upload Your Sheets</h1>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 16, lineHeight: 1.5 }}>
        Upload your sheets as <strong>CSV</strong>, <strong>TSV</strong>, or <strong>Excel (.xlsx / .xls)</strong> files.
      </p>
 
      {/* Session resume hint */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        background: '#FEF6E6', border: '1px solid #F5C97A',
        borderRadius: 8, padding: '10px 14px', marginBottom: 24, fontSize: 13,
      }}>
        <span style={{ fontSize: 18 }}>📂</span>
        <span style={{ color: '#7A4F00' }}>
          <strong>Continuing from a previous session?</strong> Click <strong>Load session</strong> in the top-right corner — your sheets and all your progress will be restored automatically. No need to re-upload anything.
        </span>
      </div>
 
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 16 }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8, color: '#444' }}>
            🗂 Master Tag Sheet <span style={{ color:'#999', fontWeight:400 }}>(1 file)</span>
          </div>
          <DropZone
            label="Drop master sheet"
            sublabel="CSV, TSV, or Excel"
            onFiles={handleMasterFiles}
            fileList={masterRaw ? [masterRaw.name] : []}
          />
 
          {/* Live preview of master sheet */}
          {masterPreview && (
            <div style={{
              marginTop: 10, padding: '12px 14px', borderRadius: 8, fontSize: 13,
              background: masterPreview.warning ? '#FFF3E0' : '#E8F5E9',
              border: `1px solid ${masterPreview.warning ? '#FFCC80' : '#A5D6A7'}`,
            }}>
              {masterPreview.warning ? (
                <div>
                  <strong style={{ color: '#E65100' }}>⚠ {masterPreview.warning}</strong>
                </div>
              ) : (
                <div>
                  <span style={{ color: '#2E7D32', fontWeight: 700 }}>✓ Recognized: </span>
                  <span style={{ color: '#2E7D32' }}>{masterPreview.tagCount} tags in {masterPreview.groupCount} group{masterPreview.groupCount !== 1 ? 's' : ''}</span>
                  <div style={{ marginTop: 6, color: '#555', fontSize: 12 }}>
                    Sample: {masterPreview.sample.map(t => (
                      <span key={t} style={{ ...S.badge('green'), marginRight: 4, fontSize: 10 }}>{t}</span>
                    ))}
                    {masterPreview.tagCount > 5 && <span style={{ color: '#AAA' }}>+{masterPreview.tagCount - 5} more</span>}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
 
        <div>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8, color: '#444' }}>
            📄 Content Sheets <span style={{ color:'#999', fontWeight:400 }}>(up to 50 files)</span>
          </div>
          <DropZone
            label="Drop content sheets"
            sublabel="CSV, TSV, or Excel · select all at once"
            onFiles={addContent}
            multiple
            fileList={contentRaw.map(f => f.name)}
            accent="#5C6BC0"
          />
          {contentRaw.length > 0 && (
            <button onClick={() => setContentRaw([])}
              style={{ ...S.btn('ghost'), fontSize: 11, marginTop: 6, color: '#999' }}>
              ✕ Clear all ({contentRaw.length})
            </button>
          )}
        </div>
      </div>
 
      {/* Master sheet column settings */}
      <div style={{ ...S.card, padding:'16px 20px', marginBottom:16 }}>
        <div style={{ fontWeight:700, fontSize:13, color:'#444', marginBottom:12 }}>🗂 Master Sheet Column Settings</div>
        <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:20 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontSize:13, color:'#555', whiteSpace:'nowrap' }}>Tag column:</span>
            <input
              style={{ ...S.input, width:64, textTransform:'uppercase', fontWeight:700, textAlign:'center' }}
              value={masterTagCol}
              onChange={e => setMasterTagCol(e.target.value.replace(/[^a-zA-Z]/g,''))}
              maxLength={1}
              title="Column containing canonical tags (default: B)"
            />
            {masterPreview?.tagHeader
              ? <span style={{ color: BRAND_DARK, fontSize:12, fontWeight:600 }}>"{masterPreview.tagHeader}"</span>
              : <span style={{ color:'#888', fontSize:12 }}>default: B</span>}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontSize:13, color:'#555', whiteSpace:'nowrap' }}>Group column:</span>
            <input
              style={{ ...S.input, width:64, textTransform:'uppercase', fontWeight:700, textAlign:'center' }}
              value={masterGrpCol}
              onChange={e => setMasterGrpCol(e.target.value.replace(/[^a-zA-Z]/g,''))}
              maxLength={1}
              title="Column containing tag group/category (default: A)"
            />
            {masterPreview?.grpHeader
              ? <span style={{ color: BRAND_DARK, fontSize:12, fontWeight:600 }}>"{masterPreview.grpHeader}"</span>
              : <span style={{ color:'#888', fontSize:12 }}>default: A</span>}
          </div>
          <label style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', fontSize:13, color:'#555' }}>
            <input
              type="checkbox"
              checked={hasHeader}
              onChange={e => setHasHeader(e.target.checked)}
              style={{ width:15, height:15, accentColor: BRAND }}
            />
            First row is a header
          </label>
        </div>
        {masterRaw && !masterPreview && (
          <div style={{ marginTop:10, fontSize:12, color:'#888' }}>⏳ Parsing master sheet…</div>
        )}
      </div>
 
      {/* Content sheet column settings */}
      <div style={{ ...S.card, display:'flex', alignItems:'center', gap:16, padding:'16px 20px', marginBottom:24, flexWrap:'wrap' }}>
        <span style={{ fontWeight:700, fontSize:13, color:'#444', whiteSpace:'nowrap' }}>📄 Content tag column:</span>
        <input
          style={{ ...S.input, width:70, textTransform:'uppercase', fontWeight:700, textAlign:'center' }}
          value={colLetter}
          onChange={e => setColLetter(e.target.value.replace(/[^a-zA-Z]/g,''))}
          maxLength={1}
        />
        {contentHeaders
          ? <span style={{ color: BRAND_DARK, fontSize:13, fontWeight:600 }}>"{contentHeaders}" (col {colLetter.toUpperCase() || '?'})</span>
          : <span style={{ color:'#888', fontSize:13 }}>Column <strong>{colLetter.toUpperCase() || '?'}</strong> = index {colIdx} (default: P = 15)</span>
        }
      </div>
 
      {error && (
        <div style={{ background:'#FFEBEE', color:'#C62828', padding:'12px 16px', borderRadius:8, marginBottom:16, fontSize:13 }}>
          ⚠️ {error}
        </div>
      )}
 
      <button onClick={handleGo} disabled={!ready || loading}
        style={{ ...S.btn('primary'), fontSize:15, padding:'11px 28px', opacity: ready && !loading ? 1 : 0.45 }}>
        {loading ? '⏳ Analyzing…' : `Analyze ${contentRaw.length || 0} Sheet${contentRaw.length !== 1 ? 's' : ''} →`}
      </button>
    </div>
  );
}
 
// ─── MISSING TAGS TAB ────────────────────────────────────────────────────────
function MissingTab({ missingTags, masterGroups, onAddToMaster, addedTags, tagColumnMap, colLetter }) {
  const [search,      setSearch]      = useState('');
  const [groupInputs, setGroupInputs] = useState({});
  const [dismissed,   setDismissed]   = useState(new Set());
  const [showIgnored, setShowIgnored] = useState(false);
 
  const filtered = useMemo(() =>
    missingTags.filter(({ tag }) => {
      if (!tag.toLowerCase().includes(search.toLowerCase())) return false;
      if (dismissed.has(tag) && !showIgnored) return false;
      return true;
    }),
    [missingTags, search, dismissed, showIgnored]
  );
 
  const totalUses = useMemo(() =>
    missingTags.reduce((s, { occurrences }) =>
      s + occurrences.reduce((ss, o) => ss + o.rowIndices.length, 0), 0),
    [missingTags]
  );
 
  return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '32px 28px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20, flexWrap:'wrap', gap:12 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:800 }}>Missing from Master</h2>
          <p style={{ color:'#666', fontSize:13, marginTop:4 }}>
            {missingTags.length} tag{missingTags.length !== 1 ? 's' : ''} used in content sheets but absent from master · {totalUses} total usages
          </p>
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
          {dismissed.size > 0 && (
            <button onClick={() => setShowIgnored(x => !x)}
              style={{ ...S.btn('ghost'), fontSize:12, color:'#999' }}>
              {showIgnored ? 'Hide' : 'Show'} ignored ({dismissed.size})
            </button>
          )}
          <button
            onClick={() => { setDismissed(new Set()); setShowIgnored(false); }}
            style={{ ...S.btn('ghost'), fontSize:12, color: BRAND_DARK, border:`1px solid ${BRAND}` }}
            title="Re-scan: clears ignored tags and refreshes the list against your current replacements">
            🔄 Re-scan
          </button>
          <input placeholder="Search tags…" style={{ ...S.input, width:220 }}
            value={search} onChange={e => setSearch(e.target.value)} />
        </div>
      </div>
 
      {filtered.length === 0 ? (
        <div style={{ textAlign:'center', padding:'64px 0', color:'#888' }}>
          {missingTags.length === 0 ? '🎉 All content tags exist in the master sheet!' : 'No tags match your search.'}
        </div>
      ) : (
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ borderBottom:'2px solid #ECEAE6' }}>
              {['Tag','Appears in sheets','Usages','Also in columns','Assign group',''].map(h => (
                <th key={h} style={{ textAlign:'left', padding:'10px 12px', fontWeight:700, color:'#555', fontSize:12 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map(({ tag, renamedFrom, occurrences }) => {
              const uses      = occurrences.reduce((s, o) => s + o.rowIndices.length, 0);
              const added     = addedTags.has(tag);
              const isIgnored = dismissed.has(tag);
              const unsafe    = !isURLSafe(tag);
              const gi        = groupInputs[tag] || '';
              return (
                <tr key={tag} style={{ borderBottom:'1px solid #F2F0EC', background: added ? '#F6FBF6' : isIgnored ? '#FAF9F7' : renamedFrom ? '#FFFBF2' : 'white', opacity: isIgnored ? 0.5 : 1 }}>
                  <td style={{ padding:'10px 12px' }}>
                    <span style={{ fontFamily:'monospace', fontWeight:700 }}>{tag}</span>
                    {unsafe && <span style={{ ...S.badge('red'), marginLeft:8 }}>⚠ unsafe chars</span>}
                    {isIgnored && <span style={{ ...S.badge('gray'), marginLeft:8 }}>Ignored</span>}
                    {renamedFrom && (
                      <div style={{ marginTop:3, fontSize:11, color:'#A0660A' }}>
                        ✏️ renamed from <span style={{ fontFamily:'monospace', textDecoration:'line-through', color:'#C0820D' }}>{renamedFrom}</span>
                      </div>
                    )}
                  </td>
                  <td style={{ padding:'10px 12px', color:'#666', fontSize:12 }}>
                    {occurrences.slice(0,3).map(o => o.fileName.replace('.csv','')).join(', ')}
                    {occurrences.length > 3 && <span style={{ color:'#AAA' }}> +{occurrences.length-3}</span>}
                  </td>
                  <td style={{ padding:'10px 12px' }}>
                    <span style={S.badge('blue')}>{uses}</span>
                  </td>
                  <td style={{ padding:'10px 12px', fontSize:11, color:'#666' }}>
                    {tagColumnMap && tagColumnMap.has(tag)
                      ? [...tagColumnMap.get(tag)].map(ci => (
                          <span key={ci} style={{ ...S.badge('purple'), marginRight:3 }}>{colLetter(ci)}</span>
                        ))
                      : <span style={{ color:'#CCC' }}>—</span>
                    }
                  </td>
                  <td style={{ padding:'10px 12px', minWidth:180 }}>
                    {!added && !isIgnored ? (
                      <div style={{ position:'relative' }}>
                        <input
                          list={`grp-${tag}`}
                          placeholder="Group (optional)…"
                          style={{ ...S.input, fontSize:12 }}
                          value={gi}
                          onChange={e => setGroupInputs(prev => ({ ...prev, [tag]: e.target.value }))}
                        />
                        <datalist id={`grp-${tag}`}>
                          {masterGroups.map(g => <option key={g} value={g} />)}
                        </datalist>
                      </div>
                    ) : (
                      <span style={{ color:'#AAA', fontSize:12 }}>{gi || '—'}</span>
                    )}
                  </td>
                  <td style={{ padding:'10px 12px', textAlign:'right' }}>
                    {isIgnored ? (
                      <button onClick={() => setDismissed(prev => { const n = new Set(prev); n.delete(tag); return n; })}
                        style={{ ...S.btn('ghost'), fontSize:12, color:'#999' }}>Un-ignore</button>
                    ) : added ? (
                      <span style={S.badge('green')}>✓ Added to master</span>
                    ) : (
                      <div style={{ display:'flex', gap:6, justifyContent:'flex-end' }}>
                        <button onClick={() => setDismissed(prev => new Set([...prev, tag]))}
                          style={{ ...S.btn('ghost'), fontSize:11, color:'#AAA' }}>Ignore</button>
                        <button onClick={() => { onAddToMaster(tag, gi, renamedFrom); }}
                          style={S.btn('primary')}>
                          + Add to master
                        </button>
                      </div>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}
 
// ─── VARIATIONS TAB ──────────────────────────────────────────────────────────
// ─── DUPLICATES & WHITESPACE TAB ─────────────────────────────────────────────
function DuplicatesTab({ contentFiles, colIdx, onFixApplied }) {
  const dupeRows   = useMemo(() => findDuplicateRows(contentFiles, colIdx),   [contentFiles, colIdx]);
  const wsTags     = useMemo(() => findWhitespaceTags(contentFiles, colIdx),  [contentFiles, colIdx]);
  const [fixedDupes,     setFixedDupes]     = useState(new Set()); // "fi-ri"
  const [fixedWS,        setFixedWS]        = useState(new Set()); // raw tag string
  const [dismissedDupes, setDismissedDupes] = useState(new Set()); // "fi-ri"
  const [dismissedWS,    setDismissedWS]    = useState(new Set()); // raw tag string
  const [showIgnoredD,   setShowIgnoredD]   = useState(false);
  const [showIgnoredWS,  setShowIgnoredWS]  = useState(false);
  const [tab, setTab] = useState('dupes');
 
  function applyAllDupes() {
    // Tell parent to write deduped values back into rows
    dupeRows.forEach(({ fileIndex, rowIndex, deduped }) => {
      onFixApplied('dupe', fileIndex, rowIndex, deduped);
    });
    setFixedDupes(new Set(dupeRows.map(r => `${r.fileIndex}-${r.rowIndex}`)));
  }
 
  function applyAllWS() {
    wsTags.forEach(({ raw, trimmed }) => {
      onFixApplied('whitespace', raw, trimmed);
    });
    setFixedWS(new Set(wsTags.map(w => w.raw)));
  }
 
  const SubTab = ({ id, label, count }) => (
    <button onClick={() => setTab(id)} style={{
      padding: '8px 14px', border: 'none', borderRadius: 7,
      background: tab === id ? BRAND_LIGHT : 'transparent',
      color: tab === id ? BRAND_DARK : '#666',
      fontWeight: tab === id ? 700 : 500, fontSize: 13, cursor: 'pointer',
    }}>
      {label} <span style={{ ...S.badge(tab === id ? 'orange' : 'gray'), fontSize: 10, marginLeft: 4 }}>{count}</span>
    </button>
  );
 
  return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '32px 28px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <h2 style={{ fontSize: 22, fontWeight: 800 }}>Duplicates & Whitespace</h2>
        <button
          onClick={() => { setFixedDupes(new Set()); setFixedWS(new Set()); setDismissedDupes(new Set()); setDismissedWS(new Set()); }}
          style={{ ...S.btn('ghost'), fontSize:12, color: BRAND_DARK, border:`1px solid ${BRAND}` }}
          title="Re-scan: clears fixed/ignored state to show the current data fresh">
          🔄 Re-scan
        </button>
      </div>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 20 }}>
        Cells with repeated tags, and tags with invisible leading/trailing spaces.
      </p>
 
      <div style={{ display: 'flex', gap: 6, marginBottom: 20 }}>
        <SubTab id="dupes" label="Duplicate tags in cell" count={dupeRows.length} />
        <SubTab id="ws"    label="Whitespace issues"      count={wsTags.length} />
      </div>
 
      {tab === 'dupes' && (
        <>
          {dupeRows.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '60px 0', color: '#888' }}>✅ No duplicate tags found within any cell.</div>
          ) : (
            <>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
                {dismissedDupes.size > 0 && (
                  <button onClick={() => setShowIgnoredD(x => !x)}
                    style={{ ...S.btn('ghost'), fontSize: 12, color: '#999' }}>
                    {showIgnoredD ? 'Hide' : 'Show'} ignored ({dismissedDupes.size})
                  </button>
                )}
                <button onClick={applyAllDupes}
                  disabled={dupeRows.filter(r => !dismissedDupes.has(`${r.fileIndex}-${r.rowIndex}`) && !fixedDupes.has(`${r.fileIndex}-${r.rowIndex}`)).length === 0}
                  style={{ ...S.btn('primary'), marginLeft: 'auto', opacity: dupeRows.filter(r => !dismissedDupes.has(`${r.fileIndex}-${r.rowIndex}`) && !fixedDupes.has(`${r.fileIndex}-${r.rowIndex}`)).length === 0 ? 0.4 : 1 }}>
                  Fix all remaining
                </button>
              </div>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <thead>
                  <tr style={{ borderBottom: '2px solid #ECEAE6' }}>
                    {['Sheet', 'Row', 'Duplicate tags', 'Cell value (trimmed)', ''].map(h => (
                      <th key={h} style={{ textAlign: 'left', padding: '9px 12px', fontWeight: 700, color: '#555', fontSize: 12 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {dupeRows.map(({ fileName, fileIndex, rowIndex, original, deduped, dupes }) => {
                    const key       = `${fileIndex}-${rowIndex}`;
                    const fixed     = fixedDupes.has(key);
                    const dismissed = dismissedDupes.has(key);
                    if (dismissed && !showIgnoredD) return null;
                    return (
                      <tr key={key} style={{ borderBottom: '1px solid #F2F0EC', background: dismissed ? '#FAF9F7' : fixed ? '#F6FBF6' : 'white', opacity: dismissed ? 0.55 : 1 }}>
                        <td style={{ padding: '9px 12px', color: '#666', fontSize: 12 }}>{fileName.replace(/\.(csv|tsv|xlsx?)$/i, '')}</td>
                        <td style={{ padding: '9px 12px' }}>{rowIndex}</td>
                        <td style={{ padding: '9px 12px' }}>
                          {dupes.map(d => <span key={d} style={{ ...S.badge('red'), marginRight: 4 }}>{d}</span>)}
                        </td>
                        <td style={{ padding: '9px 12px', fontFamily: 'monospace', fontSize: 12, color: '#444', maxWidth: 300, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                          {original.join(' | ')}
                        </td>
                        <td style={{ padding: '9px 12px', textAlign: 'right' }}>
                          {dismissed ? (
                            <button onClick={() => setDismissedDupes(prev => { const n = new Set(prev); n.delete(key); return n; })}
                              style={{ ...S.btn('ghost'), fontSize: 11, color: '#999' }}>Un-ignore</button>
                          ) : fixed ? <span style={S.badge('green')}>✓ Fixed</span> : (
                            <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                              <button onClick={() => setDismissedDupes(prev => new Set([...prev, key]))}
                                style={{ ...S.btn('ghost'), fontSize: 11, color: '#AAA' }}>Ignore</button>
                              <button onClick={() => {
                                onFixApplied('dupe', fileIndex, rowIndex, deduped);
                                setFixedDupes(prev => new Set([...prev, key]));
                              }} style={{ ...S.btn('primary'), fontSize: 12 }}>Fix row</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </>
          )}
        </>
      )}
 
      {tab === 'ws' && (
        <>
          {wsTags.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '60px 0', color: '#888' }}>✅ No whitespace issues found.</div>
          ) : (
            <>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
                {dismissedWS.size > 0 && (
                  <button onClick={() => setShowIgnoredWS(x => !x)}
                    style={{ ...S.btn('ghost'), fontSize: 12, color: '#999' }}>
                    {showIgnoredWS ? 'Hide' : 'Show'} ignored ({dismissedWS.size})
                  </button>
                )}
                <button onClick={applyAllWS}
                  disabled={wsTags.filter(w => !dismissedWS.has(w.raw) && !fixedWS.has(w.raw)).length === 0}
                  style={{ ...S.btn('primary'), marginLeft: 'auto', opacity: wsTags.filter(w => !dismissedWS.has(w.raw) && !fixedWS.has(w.raw)).length === 0 ? 0.4 : 1 }}>
                  Fix all remaining
                </button>
              </div>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
                <thead>
                  <tr style={{ borderBottom: '2px solid #ECEAE6' }}>
                    {['Raw (with spaces)', 'Trimmed', 'Occurrences', ''].map(h => (
                      <th key={h} style={{ textAlign: 'left', padding: '9px 12px', fontWeight: 700, color: '#555', fontSize: 12 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {wsTags.map(({ raw, trimmed, occurrences }) => {
                    const fixed     = fixedWS.has(raw);
                    const dismissed = dismissedWS.has(raw);
                    if (dismissed && !showIgnoredWS) return null;
                    return (
                      <tr key={raw} style={{ borderBottom: '1px solid #F2F0EC', background: dismissed ? '#FAF9F7' : fixed ? '#F6FBF6' : 'white', opacity: dismissed ? 0.55 : 1 }}>
                        <td style={{ padding: '9px 12px', fontFamily: 'monospace' }}>
                          <span style={{ background: '#FFF8E1', padding: '2px 6px', borderRadius: 4 }}>"{raw}"</span>
                        </td>
                        <td style={{ padding: '9px 12px', fontFamily: 'monospace', color: '#2E7D32', fontWeight: 600 }}>"{trimmed}"</td>
                        <td style={{ padding: '9px 12px' }}><span style={S.badge('blue')}>{occurrences.length}</span></td>
                        <td style={{ padding: '9px 12px', textAlign: 'right' }}>
                          {dismissed ? (
                            <button onClick={() => setDismissedWS(prev => { const n = new Set(prev); n.delete(raw); return n; })}
                              style={{ ...S.btn('ghost'), fontSize: 11, color: '#999' }}>Un-ignore</button>
                          ) : fixed ? <span style={S.badge('green')}>✓ Fixed</span> : (
                            <div style={{ display: 'flex', gap: 6, justifyContent: 'flex-end' }}>
                              <button onClick={() => setDismissedWS(prev => new Set([...prev, raw]))}
                                style={{ ...S.btn('ghost'), fontSize: 11, color: '#AAA' }}>Ignore</button>
                              <button onClick={() => {
                                onFixApplied('whitespace', raw, trimmed);
                                setFixedWS(prev => new Set([...prev, raw]));
                              }} style={{ ...S.btn('primary'), fontSize: 12 }}>Trim tag</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </>
          )}
        </>
      )}
    </div>
  );
}
 
function VariationsTab({ variationGroups, allContentTags, masterTagSet, renamedMasterTags, replacements, onSetReplacement, resolved, onResolve, loading, onRerun }) {
  const [customs,        setCustoms]        = useState({});
  const [search,         setSearch]         = useState('');
  const [showDone,       setShowDone]       = useState(false);
  // excluded: Map<groupId, Set<tag>> — tags removed from a group by the user
  const [excluded,       setExcluded]       = useState(new Map());
  // undo history for ✕ dismissals — each entry is a snapshot of excluded
  const [excludedHistory, setExcludedHistory] = useState([]);
 
  function removeFromGroup(groupId, tag) {
    setExcluded(prev => {
      setExcludedHistory(h => [...h, prev]); // snapshot before change
      const next = new Map(prev);
      if (!next.has(groupId)) next.set(groupId, new Set());
      next.get(groupId).add(tag);
      return next;
    });
  }
 
  function undoLastDismissal() {
    setExcludedHistory(h => {
      if (!h.length) return h;
      const prev = h[h.length - 1];
      setExcluded(prev);
      return h.slice(0, -1);
    });
  }
 
  // Group-level dismiss (hides the entire group)
  const [dismissedGroups, setDismissedGroups] = useState(new Set());
  const [showIgnoredGroups, setShowIgnoredGroups] = useState(false);
 
  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return variationGroups.filter(g =>
      !q || g.variants.some(v => v.toLowerCase().includes(q))
    );
  }, [variationGroups, search]);
 
  const pending   = filtered.filter(g => !resolved.has(g.id) && !dismissedGroups.has(g.id));
  const done      = filtered.filter(g =>  resolved.has(g.id));
  const ignored   = filtered.filter(g =>  dismissedGroups.has(g.id));
  const visible   = showDone ? [...pending, ...done] : pending;
 
  function usageCount(tag) {
    const occ = allContentTags.get(tag);
    return occ ? occ.reduce((s, o) => s + o.rowIndices.length, 0) : 0;
  }
 
  function pickCanonical(group, canonical) {
    const excludedInGrp = excluded.get(group.id) || new Set();
    // Only replace non-excluded variants — dismissed tags are left untouched
    group.variants
      .filter(v => !excludedInGrp.has(v) && v !== canonical)
      .forEach(v => onSetReplacement(v, canonical));
    onResolve(prev => new Set([...prev, group.id]));
  }
 
  function applyCustom(group) {
    const val = (customs[group.id] || '').trim();
    if (!val) return;
    const excludedInGrp = excluded.get(group.id) || new Set();
    group.variants
      .filter(v => !excludedInGrp.has(v))
      .forEach(v => onSetReplacement(v, val));
    onResolve(prev => new Set([...prev, group.id]));
  }
 
  if (loading) return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '80px 28px', textAlign:'center', color:'#888' }}>
      <div style={{ fontSize:32, marginBottom:16 }}>⏳</div>
      <div style={{ fontWeight:700, fontSize:16, marginBottom:6 }}>Detecting tag variations…</div>
      <div style={{ fontSize:13 }}>Comparing all tags for spelling and phonetic matches. This may take a moment with many sheets.</div>
    </div>
  );
 
  return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '32px 28px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20, flexWrap:'wrap', gap:12 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:800 }}>Tag Variations</h2>
          <p style={{ color:'#666', fontSize:13, marginTop:4 }}>
            {variationGroups.length} group{variationGroups.length !== 1 ? 's' : ''} of similar tags detected.

          </p>
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
          <input placeholder="Search…" style={{ ...S.input, width:200 }}

          {excludedHistory.length > 0 && (
            <button onClick={undoLastDismissal}
              style={{ ...S.btn('ghost'), fontSize:12, color: BRAND_DARK, whiteSpace:'nowrap', border:`1px solid ${BRAND}` }}>

            </button>
          )}
          {ignored.length > 0 && (
            <button onClick={() => setShowIgnoredGroups(x => !x)}
              style={{ ...S.btn('ghost'), fontSize:12, color:'#999', whiteSpace:'nowrap' }}>
              {showIgnoredGroups ? 'Hide' : 'Show'} ignored ({ignored.length})
            </button>
          )}
          <button onClick={() => setShowDone(x => !x)}
            style={{ ...S.btn('ghost'), fontSize:12, color:'#888', whiteSpace:'nowrap' }}>
            {showDone ? 'Hide resolved' : `Show resolved (${done.length})`}
          </button>
          <button onClick={onRerun} disabled={loading}
            style={{ ...S.btn('ghost'), fontSize:12, color: BRAND_DARK, whiteSpace:'nowrap', border:`1px solid ${BRAND}`, opacity: loading ? 0.5 : 1 }}
            title="Re-run detection on all tags — catches new variations after replacements">
            🔄 Re-run
          </button>
        </div>
      </div>
 
      {pending.length === 0 && !showDone ? (
        <div style={{ textAlign:'center', padding:'64px 0', color:'#888' }}>
          {variationGroups.length === 0
            ? '🎉 No tag variations detected!'

        </div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          {[...visible, ...(showIgnoredGroups ? ignored : [])].map(group => {
            const isResolved    = resolved.has(group.id);
            const isIgnored     = dismissedGroups.has(group.id);
            const custom        = customs[group.id] || '';
            const excludedInGrp = excluded.get(group.id) || new Set();
            // Only show variants not dismissed by the user
            const visibleVariants = group.variants.filter(v => !excludedInGrp.has(v));
            // If only 1 variant left after exclusions, don't render the group at all
            if (visibleVariants.length < 2 && !isResolved && !isIgnored) return null;
            return (
              <div key={group.id} style={{
                ...S.card,
                opacity: isResolved ? 0.65 : isIgnored ? 0.45 : 1,
                border: isResolved ? '1px solid #C8E6C9' : isIgnored ? '1px solid #DDD' : '1px solid #ECEAE6',
              }}>
                {/* Group header */}
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                  <div style={{ fontSize:12, color:'#888', display:'flex', alignItems:'center', flexWrap:'wrap', gap:6 }}>
                    <span>Normalized: <code style={{ fontFamily:'monospace', background:'#F5F5F5', padding:'1px 6px', borderRadius:4, color:'#333' }}>{group.id}</code></span>
                    <span style={{ ...S.badge('purple') }}>{visibleVariants.length} variants</span>
                    <span style={{
                      ...S.badge(
                        group.reason === 'phonetic (sounds alike)' ? 'orange'

                        : 'gray'
                      )
                    }}>
                      {group.reason === 'phonetic (sounds alike)' ? '🔊 sounds alike'
                       : group.reason === 'spelling (edit distance)' ? '✏️ edit distance'
                       : '⇄ case / spacing'}
                    </span>
                    {excludedInGrp.size > 0 && (
                      <span style={{ ...S.badge('gray'), fontSize:10 }}>
                        {excludedInGrp.size} removed from group
                      </span>
                    )}
                  </div>
                  <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                    {isIgnored ? (
                      <>
                        <span style={{ ...S.badge('gray'), fontSize:11 }}>Ignored</span>
                        <button onClick={() => setDismissedGroups(prev => { const n = new Set(prev); n.delete(group.id); return n; })}
                          style={{ ...S.btn('ghost'), fontSize:11, padding:'3px 8px', color:'#888' }}>
                          Un-ignore
                        </button>
                      </>
                    ) : isResolved ? (
                      <>
                        <span style={S.badge('green')}>✓ Resolved</span>
                        <button onClick={() => onResolve(prev => { const n = new Set(prev); n.delete(group.id); return n; })}
                          style={{ ...S.btn('ghost'), fontSize:11, padding:'3px 8px', color:'#888' }}>
                          Undo
                        </button>
                      </>
                    ) : (
                      <button onClick={() => setDismissedGroups(prev => new Set([...prev, group.id]))}
                        style={{ ...S.btn('ghost'), fontSize:11, padding:'3px 8px', color:'#AAA' }}>
                        Ignore group
                      </button>
                    )}
                  </div>
                </div>
 
                {/* Variant cards — hidden when ignored */}
                {!isIgnored && <div style={{ display:'flex', flexWrap:'wrap', gap:10, marginBottom: isResolved ? 0 : 14 }}>
                  {visibleVariants.map(v => {
                    const uses         = usageCount(v);
                    const replacedWith = replacements.get(v);
                    const isTarget     = !replacedWith || replacedWith === v;
                    const inMaster     = (masterTagSet && masterTagSet.has(v)) || (renamedMasterTags && renamedMasterTags.has(v));
                    return (
                      <div key={v} style={{
                        border: `1.5px solid ${
                          isTarget && isResolved ? '#A5D6A7'
                          : inMaster && !isResolved ? BRAND
                          : '#E0E0E0'
                        }`,
                        borderRadius: 8, padding: '10px 14px', minWidth: 170,
                        background: isTarget && isResolved ? '#F1F8F1'
                          : inMaster && !isResolved ? BRAND_LIGHT
                          : replacedWith && replacedWith !== v ? '#FAFAFA'
                          : '#FFF',
                        opacity: replacedWith && replacedWith !== v ? 0.55 : 1,
                        flex: '0 0 auto', position: 'relative',
                      }}>
                        {/* Dismiss button — top-right corner */}
                        {!isResolved && (
                          <button
                            title="Remove from this group (not a real variant)"
                            onClick={() => removeFromGroup(group.id, v)}
                            style={{
                              position:'absolute', top:6, right:6,
                              background:'none', border:'none', cursor:'pointer',
                              color:'#CCC', fontSize:14, lineHeight:1, padding:'2px 4px',
                              borderRadius:4,
                            }}
                            onMouseEnter={e => e.currentTarget.style.color = '#C62828'}
                            onMouseLeave={e => e.currentTarget.style.color = '#CCC'}
                          >✕</button>
                        )}
                        <div style={{ fontFamily:'monospace', fontWeight:700, fontSize:13, marginBottom:4, paddingRight: isResolved ? 0 : 18 }}>{v}</div>
                        {inMaster && !isResolved && (
                          <div style={{ marginBottom:4 }}>
                            <span style={{ fontSize:10, fontWeight:700, color: BRAND_DARK,
                              background: '#FEF0D0', border:`1px solid ${BRAND}`,
                              borderRadius:4, padding:'1px 6px', letterSpacing:'0.3px' }}>
                              ★ in master
                            </span>
                          </div>
                        )}
                        <div style={{ fontSize:11, color:'#888', marginBottom: isResolved ? 0 : 8 }}>
                          {uses} use{uses !== 1 ? 's' : ''}
                          {replacedWith && replacedWith !== v &&
                            <span style={{ color:BRAND_DARK, marginLeft:6 }}>→ {replacedWith}</span>}
                          {isTarget && isResolved && <span style={{ color:'#2E7D32', marginLeft:6 }}>canonical</span>}
                        </div>
                        {!isResolved && (
                          <button onClick={() => pickCanonical(group, v)}
                            style={{ ...S.btn('primary'), fontSize:11, padding:'4px 10px' }}>
                            Use this
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>}
 
                {/* Custom replacement */}
                {!isResolved && !isIgnored && (
                  <div style={{ display:'flex', gap:8, alignItems:'center', borderTop:'1px solid #F2F0EC', paddingTop:12 }}>
                    <input
                      placeholder="Or type a custom replacement for all variants…"
                      style={{ ...S.input, flex:1, fontSize:12 }}
                      value={custom}
                      onChange={e => setCustoms(p => ({ ...p, [group.id]: e.target.value }))}
                      onKeyDown={e => { if (e.key === 'Enter') applyCustom(group); }}
                    />
                    <button onClick={() => applyCustom(group)}
                      disabled={!custom.trim()}
                      style={{ ...S.btn('primary'), opacity: custom.trim() ? 1 : 0.4 }}>
                      Apply
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
 
// ─── MANUAL EDIT TAB ─────────────────────────────────────────────────────────
// ─── AUTOCOMPLETE INPUT ───────────────────────────────────────────────────────
// Shows a dropdown of matching suggestions as the user types.
// masterTagSet: Set of canonical tags (shown first, labelled)
// allTagsList:  All unique tags across content sheets
function AutocompleteInput({ value, onChange, onEnter, masterTagSet, allTagsList, placeholder, style }) {
  const [open, setOpen]     = useState(false);
  const [cursor, setCursor] = useState(-1);
  const wrapRef  = useRef(null);
  const inputRef = useRef(null);
 
  // Build suggestion list: master tags first, then content-only tags
  const suggestions = useMemo(() => {
    const q = value.trim().toLowerCase();
    if (!q || q.length < 1) return [];
 
    const masterMatches  = [];
    const contentMatches = [];
 
    allTagsList.forEach(tag => {
      if (!tag.toLowerCase().includes(q)) return;
      if (masterTagSet.has(tag)) masterMatches.push(tag);
      else                       contentMatches.push(tag);
    });
 
    // Sort each group: exact prefix matches first, then alphabetical
    const sort = arr => arr.sort((a, b) => {
      const aStart = a.toLowerCase().startsWith(q);
      const bStart = b.toLowerCase().startsWith(q);
      if (aStart !== bStart) return aStart ? -1 : 1;
      return a.localeCompare(b);
    });
 
    return [...sort(masterMatches), ...sort(contentMatches)].slice(0, 12);
  }, [value, allTagsList, masterTagSet]);
 
  // Close on outside click
  useEffect(() => {
    function handler(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false); setCursor(-1);
      }
    }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
 
  function handleKey(e) {
    if (!open || !suggestions.length) {
      if (e.key === 'Enter') onEnter?.();
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setCursor(c => Math.min(c + 1, suggestions.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setCursor(c => Math.max(c - 1, -1));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (cursor >= 0) {
        onChange(suggestions[cursor]);
        setOpen(false); setCursor(-1);
      } else {
        onEnter?.();
      }
    } else if (e.key === 'Escape') {
      setOpen(false); setCursor(-1);
    }
  }
 
  function pick(tag) {
    onChange(tag);
    setOpen(false); setCursor(-1);
    inputRef.current?.focus();
  }
 
  return (
    <div ref={wrapRef} style={{ position: 'relative' }}>
      <input
        ref={inputRef}
        autoFocus
        value={value}
        onChange={e => { onChange(e.target.value); setOpen(true); setCursor(-1); }}
        onFocus={() => { if (suggestions.length) setOpen(true); }}
        onKeyDown={handleKey}
        placeholder={placeholder}
        style={style}
      />
      {open && suggestions.length > 0 && (
        <div style={{
          position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 999,
          background: '#FFF', border: '1.5px solid #DDD', borderRadius: 8,
          boxShadow: '0 6px 20px rgba(0,0,0,.13)', marginTop: 3,
          maxHeight: 260, overflowY: 'auto',
        }}>
          {/* Column headers */}
          <div style={{ display:'flex', justifyContent:'space-between', padding:'6px 12px 4px', borderBottom:'1px solid #F0F0F0' }}>
            <span style={{ fontSize:10, fontWeight:700, color:'#AAA', textTransform:'uppercase', letterSpacing:'.05em' }}>Suggestion</span>
            <span style={{ fontSize:10, fontWeight:700, color:'#AAA', textTransform:'uppercase', letterSpacing:'.05em' }}>Source</span>
          </div>
          {suggestions.map((tag, i) => {
            const isMaster   = masterTagSet.has(tag);
            const isSelected = i === cursor;
            // Highlight matching substring
            const q   = value.trim().toLowerCase();
            const idx = tag.toLowerCase().indexOf(q);
            const before = idx >= 0 ? tag.slice(0, idx) : tag;
            const match  = idx >= 0 ? tag.slice(idx, idx + q.length) : '';
            const after  = idx >= 0 ? tag.slice(idx + q.length) : '';
            return (
              <div key={tag}
                onMouseDown={() => pick(tag)}
                onMouseEnter={() => setCursor(i)}
                style={{
                  padding: '8px 12px', cursor: 'pointer',
                  background: isSelected ? BRAND_LIGHT : 'transparent',
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8,
                  borderBottom: '1px solid #F8F6F2',
                }}>
                <span style={{ fontFamily:'monospace', fontSize:13, fontWeight: isMaster ? 700 : 400, flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                  {before}
                  <mark style={{ background:'#FFE082', borderRadius:2, padding:'0 1px', fontWeight:700 }}>{match}</mark>
                  {after}
                </span>
                <span style={{ ...S.badge(isMaster ? 'orange' : 'gray'), fontSize:10, flexShrink:0 }}>
                  {isMaster ? '★ master' : 'content'}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
 
// ─── MANUAL EDIT TAB ─────────────────────────────────────────────────────────
function ManualEditTab({ allContentTags, masterTagSet, replacements, onSetReplacement }) {
  const [search,      setSearch]      = useState('');
  const [selected,    setSelected]    = useState(null); // tag string
  const [replacement, setReplacement] = useState('');
  const [applied,     setApplied]     = useState(new Set());
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [editMode,    setEditMode]    = useState('replace'); // 'replace' | 'split'
  const [splitValue,  setSplitValue]  = useState(''); // editable text with | separators
 
  const allTags = useMemo(() => [...allContentTags.keys()].sort((a, b) => a.localeCompare(b)), [allContentTags]);
 
  const results = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return [];
    return allTags.filter(t => t.toLowerCase().includes(q));
  }, [allTags, search]);
 
  function selectTag(tag) {
    setSelected(tag);
    setConfirmDelete(false);
    setEditMode('replace');
    const pending = replacements.get(tag);
    setReplacement(pending && pending !== DELETE_SENTINEL ? pending : tag);
    setSplitValue(tag); // default split value = original tag text
  }
 
  function handleApplySplit() {
    const parts = splitValue.split('|').map(p => p.trim()).filter(Boolean);
    if (parts.length < 2) return;
    const val = parts.join(' | ');
    onSetReplacement(selected, val);
    setApplied(prev => new Set([...prev, selected]));
    setSelected(null);
    setSplitValue('');
    setSearch('');
  }
 
  function handleDelete() {
    onSetReplacement(selected, DELETE_SENTINEL);
    setApplied(prev => new Set([...prev, selected]));
    setSelected(null);
    setReplacement('');
    setConfirmDelete(false);
    setSearch('');
  }
 
  function handleApply() {
    const val = replacement.trim();
    if (!val || val === selected) return;
    onSetReplacement(selected, val);
    setApplied(prev => new Set([...prev, selected]));
    setSelected(null);
    setReplacement('');
    setSearch('');
  }
 
  function usageCount(tag) {
    const occ = allContentTags.get(tag);
    return occ ? occ.reduce((s, o) => s + o.rowIndices.length, 0) : 0;
  }
 
  function sheetsFor(tag) {
    const occ = allContentTags.get(tag) || [];
    return [...new Set(occ.map(o => o.fileName.replace('.csv', '')))];
  }
 
  return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '32px 28px' }}>
      <h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Manual Tag Edit</h2>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 24, lineHeight: 1.5 }}>
        Search for any tag across all sheets and replace it — even if no variation was auto-detected.
      </p>
 
      <div style={{ display: 'grid', gridTemplateColumns: selected ? '1fr 1fr' : '1fr', gap: 20 }}>
 
        {/* Search panel */}
        <div>
          <div style={{ ...S.card, padding: '18px 20px', marginBottom: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, color: '#444' }}>
              🔍 Search tags
            </div>
            <input
              autoFocus
              placeholder="Type any part of a tag…"
              style={{ ...S.input, marginBottom: 12, fontSize: 14 }}
              value={search}
              onChange={e => { setSearch(e.target.value); setSelected(null); setReplacement(''); }}
            />
 
            {search.trim() && results.length === 0 && (
              <div style={{ color: '#AAA', fontSize: 13, padding: '12px 0', textAlign: 'center' }}>
                No tags match "{search}"
              </div>
            )}
 
            {!search.trim() && (
              <div style={{ color: '#AAA', fontSize: 13, padding: '12px 0', textAlign: 'center' }}>
                Start typing to search {allTags.length} tags
              </div>
            )}
 
            <div style={{ maxHeight: 420, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 2 }}>
              {results.map(tag => {
                const isSelected = selected === tag;
                const pending    = replacements.get(tag);
                const wasApplied = applied.has(tag);
                const uses       = usageCount(tag);
                return (
                  <div key={tag}
                    onClick={() => selectTag(tag)}
                    style={{
                      padding: '9px 12px', borderRadius: 7, cursor: 'pointer',
                      background: isSelected ? BRAND_LIGHT : '#FAFAF8',
                      border: `1.5px solid ${isSelected ? BRAND : '#ECEAE6'}`,
                      transition: 'all .12s',
                    }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                      <div>
                        {/* Highlight matching part */}
                        <HighlightMatch text={tag} query={search.trim()} />
                        {pending && pending !== tag && (
                          <span style={{ ...S.badge('yellow'), marginLeft: 8, fontSize: 10 }}>→ {pending}</span>
                        )}
                        {wasApplied && (
                          <span style={{ ...S.badge('green'), marginLeft: 8, fontSize: 10 }}>✓ replaced</span>
                        )}
                      </div>
                      <span style={{ ...S.badge('blue'), fontSize: 10, flexShrink: 0 }}>{uses} use{uses !== 1 ? 's' : ''}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
 
        {/* Edit panel — shown when a tag is selected */}
        {selected && (
          <div style={{ ...S.card, padding: '22px 24px', marginBottom: 0, alignSelf: 'flex-start' }}>
 
            {/* Original tag */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#AAA', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 5 }}>

              <div style={{ fontFamily: 'monospace', fontSize: 15, fontWeight: 700, color: '#333', background: '#F5F3EF', padding: '8px 12px', borderRadius: 7, wordBreak: 'break-all' }}>
