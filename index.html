// ─── ALL TAGS TAB ────────────────────────────────────────────────────────────
function AllTagsTab({ allContentTags, masterFile, replacements, onSetReplacement }) {
  const [search,    setSearch]    = useState('');
  const [filterGrp, setFilterGrp] = useState('');
  const [filterSt,  setFilterSt]  = useState('all'); // all | inmaster | missing | queued
  const [sortBy,    setSortBy]    = useState('uses'); // uses | alpha | group
  const [groupView, setGroupView] = useState(false);  // group by master group
 
  // Tags that will be in master after export due to a master-side rename
  const renamedMasterDests = useMemo(() => {
    if (!masterFile) return new Set();
    const s = new Set();
    masterFile.tags.forEach((_, masterTag) => {
      const dest = replacements.get(masterTag);
      if (!dest || dest === DELETE_SENTINEL) return;
      parseTags(dest).forEach(part => s.add(part));
    });
    return s;
  }, [masterFile, replacements]);
 
  // Build flat list of { tag, group, uses, sheets, status }
  const rows = useMemo(() => {
    const masterTags = masterFile ? masterFile.tags : new Map(); // tag -> group
    const out = [];
    allContentTags.forEach((occurrences, tag) => {
      const uses   = occurrences.reduce((s, o) => s + o.rowIndices.length, 0);
      const sheets = occurrences.length;
      const group  = masterTags.get(tag) || '';
      const inMaster = masterTags.has(tag) || renamedMasterDests.has(tag);
      const repl   = replacements.get(tag);
      let status = inMaster ? 'inmaster' : 'missing';
      if (repl) status = repl === '\x00DELETE\x00' ? 'delete' : 'queued';
      out.push({ tag, group, uses, sheets, inMaster, status, repl });
    });
    return out;
  }, [allContentTags, masterFile, replacements, renamedMasterDests]);
 
  const groups = useMemo(() => {
    const s = new Set();
    rows.forEach(r => { if (r.group) s.add(r.group); });
    return ['', ...([...s].sort())];
  }, [rows]);
 
  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return rows.filter(r => {
      if (q && !r.tag.toLowerCase().includes(q) && !r.group.toLowerCase().includes(q)) return false;
      if (filterGrp && r.group !== filterGrp) return false;
      if (filterSt !== 'all' && r.status !== filterSt) return false;
      return true;
    });
  }, [rows, search, filterGrp, filterSt]);
 
  const sorted = useMemo(() => {
    return [...filtered].sort((a, b) => {
      if (sortBy === 'uses')  return b.uses - a.uses;
      if (sortBy === 'alpha') return a.tag.localeCompare(b.tag);
      if (sortBy === 'group') return (a.group || 'zzz').localeCompare(b.group || 'zzz') || a.tag.localeCompare(b.tag);
      return 0;
    });
  }, [filtered, sortBy]);
 
  // Group by master group for grouped view
  const byGroup = useMemo(() => {
    const map = new Map();
    sorted.forEach(r => {
      const key = r.group || '(no group / not in master)';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    return [...map.entries()].sort(([a], [b]) => {
      if (a.startsWith('(')) return 1;
      if (b.startsWith('(')) return -1;
      return a.localeCompare(b);
    });
  }, [sorted]);
 
  const statusBadge = r => {
    if (r.status === 'delete')   return <span style={{ ...S.badge('red'),    marginLeft:6 }}>🗑 delete</span>;
    if (r.status === 'queued')   return <span style={{ ...S.badge('orange'), marginLeft:6 }}>→ {r.repl}</span>;
    if (r.status === 'inmaster') return <span style={{ ...S.badge('green'),  marginLeft:6 }}>✓ master</span>;
    return                              <span style={{ ...S.badge('gray'),   marginLeft:6 }}>not in master</span>;
  };
 
  const StatusCounts = () => {
    const counts = { inmaster: 0, missing: 0, queued: 0, delete: 0 };
    rows.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
    return (
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginBottom:16 }}>
        {[['all','All',rows.length,'gray'],['inmaster','In master',counts.inmaster,'green'],
          ['missing','Not in master',counts.missing,'gray'],['queued','Queued replacement',counts.queued,'orange'],
          ['delete','Queued deletion',counts.delete,'red']
        ].map(([id, label, n, color]) => (
          <button key={id} onClick={() => setFilterSt(id)}
            style={{ ...S.btn(filterSt === id ? 'primary' : 'ghost'), fontSize:12, padding:'5px 12px' }}>
            {label} <span style={{ ...S.badge(filterSt === id ? 'orange' : color), marginLeft:4, fontSize:10 }}>{n}</span>
          </button>
        ))}
      </div>
    );
  };
 
  const TagRow = ({ r }) => (
    <tr style={{ borderBottom:'1px solid #F2F0EC' }}>
      <td style={{ padding:'8px 12px', fontFamily:'monospace', fontWeight:700, fontSize:13 }}>
        {r.tag}
        {statusBadge(r)}
      </td>
      <td style={{ padding:'8px 12px', fontSize:12, color:'#666' }}>{r.group || <span style={{ color:'#CCC' }}>—</span>}</td>
      <td style={{ padding:'8px 12px', textAlign:'right' }}><span style={S.badge('blue')}>{r.uses}</span></td>
      <td style={{ padding:'8px 12px', textAlign:'right', color:'#888', fontSize:12 }}>{r.sheets}</td>
    </tr>
  );
 
  return (
    <div style={{ maxWidth: 1060, margin:'0 auto', padding:'32px 28px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20, flexWrap:'wrap', gap:12 }}>
        <div>
          <h2 style={{ fontSize:22, fontWeight:800 }}>All Tags</h2>
          <p style={{ color:'#666', fontSize:13, marginTop:4 }}>
            {rows.length} unique tags across all content sheets — showing {filtered.length}
          </p>
        </div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' }}>
          <input placeholder="Search tags or groups…" style={{ ...S.input, width:220 }}
            value={search} onChange={e => setSearch(e.target.value)} />
          <select value={filterGrp} onChange={e => setFilterGrp(e.target.value)}
            style={{ ...S.input, width:160, fontSize:12 }}>
            <option value="">All groups</option>
            {groups.filter(Boolean).map(g => <option key={g} value={g}>{g}</option>)}
          </select>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            style={{ ...S.input, width:130, fontSize:12 }}>
            <option value="uses">Sort: Most used</option>
            <option value="alpha">Sort: A–Z</option>
            <option value="group">Sort: By group</option>
          </select>
          <button onClick={() => setGroupView(x => !x)}
            style={{ ...S.btn(groupView ? 'primary' : 'ghost'), fontSize:12 }}>
            {groupView ? '▦ Grouped' : '▤ Flat'}
          </button>
        </div>
      </div>
 
      <StatusCounts />
 
      {sorted.length === 0 ? (
        <div style={{ textAlign:'center', padding:'64px 0', color:'#888' }}>No tags match your filters.</div>
      ) : groupView ? (
        // ── Grouped view ──
        <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
          {byGroup.map(([grpName, grpRows]) => (
            <div key={grpName}>
              <div style={{ fontWeight:700, fontSize:13, color: grpName.startsWith('(') ? '#AAA' : BRAND_DARK,
                borderBottom:`2px solid ${grpName.startsWith('(') ? '#EEE' : BRAND_LIGHT}`,
                paddingBottom:6, marginBottom:8, display:'flex', alignItems:'center', gap:8 }}>
                {grpName}
                <span style={{ ...S.badge('gray'), fontWeight:400 }}>{grpRows.length} tags</span>
              </div>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                <tbody>
                  {grpRows.map(r => <TagRow key={r.tag} r={r} />)}
                </tbody>
              </table>
            </div>
          ))}
        </div>
      ) : (
        // ── Flat table ──
        <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
          <thead>
            <tr style={{ borderBottom:'2px solid #ECEAE6' }}>
              {['Tag / Status','Group','Uses','Sheets'].map(h => (
                <th key={h} style={{ textAlign: h === 'Uses' || h === 'Sheets' ? 'right' : 'left',
                  padding:'9px 12px', fontWeight:700, color:'#555', fontSize:12 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(r => <TagRow key={r.tag} r={r} />)}
          </tbody>
        </table>
      )}
    </div>
  );
}
 
// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [tab,             setTab]             = useState('upload');
  const [masterFile,      setMasterFile]      = useState(null);
  const [masterRows,      setMasterRows]      = useState([]);
  const [contentFiles,    setContentFiles]    = useState([]);
  const [colIdx,          setColIdx]          = useState(DEFAULT_TAG_COL);
  const [parsed,          setParsed]          = useState(false);
  const [replacements,    setReplacements]    = useState(new Map());
  const [varResolved,     setVarResolved]     = useState(new Set()); // variation groups marked resolved
  const [columnHeaders,   setColumnHeaders]   = useState({}); // colIdx -> header name from row 0
  const [masterTagsToAdd, setMasterTagsToAdd] = useState([]);
  const [addedTags,       setAddedTags]       = useState(new Set());
  const [history,         setHistory]         = useState([]);   // change log
  const [showHistory,     setShowHistory]     = useState(false);
  // undoStack entries: { replacements: Map, varResolved: Set }
  const [undoStack,       setUndoStack]       = useState([]);
  const [redoStack,       setRedoStack]       = useState([]);
  const historyId = useRef(0);
  const saveInputRef = useRef(null);
  const projIdRef = useRef(0);
 
  // ── PROJECTS ─────────────────────────────────────────────────────────────
  const [projects, setProjects] = useState([{ id: 'proj-0', name: 'Project 1', snapshot: null }]);
  const [activeProjectId, setActiveProjectId] = useState('proj-0');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal,  setRenameVal]  = useState('');
 
  function captureSnapshot() {
    return {
      tab, masterFile, masterRows, contentFiles, colIdx, parsed,
      replacements:    new Map(replacements),
      varResolved:     new Set(varResolved),
      columnHeaders:   { ...columnHeaders },
      masterTagsToAdd: [...masterTagsToAdd],
      addedTags:       new Set(addedTags),
      history:         [...history],
      undoStack:       [...undoStack],
      redoStack:       [...redoStack],
    };
  }
 
  function restoreSnapshot(snap) {
    setTab(snap?.tab || 'upload');
    setMasterFile(snap?.masterFile || null);
    setMasterRows(snap?.masterRows || []);
    setContentFiles(snap?.contentFiles || []);
    setColIdx(snap?.colIdx ?? DEFAULT_TAG_COL);
    setParsed(snap?.parsed || false);
    setReplacements(new Map(snap?.replacements || []));
    setVarResolved(new Set(snap?.varResolved || []));
    setColumnHeaders({ ...(snap?.columnHeaders || {}) });
    setMasterTagsToAdd(snap?.masterTagsToAdd || []);
    setAddedTags(new Set(snap?.addedTags || []));
    setHistory(snap?.history || []);
    setUndoStack(snap?.undoStack || []);
    setRedoStack(snap?.redoStack || []);
  }
 
  function switchProject(newId) {
    if (newId === activeProjectId) return;
    const snap = captureSnapshot();
    // Find target snapshot before setting state
    const target = projects.find(p => p.id === newId);
    setProjects(prev => prev.map(p =>
      p.id === activeProjectId ? { ...p, snapshot: snap } : p
    ));
    setActiveProjectId(newId);
    restoreSnapshot(target?.snapshot || null);
  }
 
  function addProject() {
    const snap = captureSnapshot();
    const newId = `proj-${++projIdRef.current}`;
    const num   = projects.length + 1;
    setProjects(prev => [
      ...prev.map(p => p.id === activeProjectId ? { ...p, snapshot: snap } : p),
      { id: newId, name: `Project ${num}`, snapshot: null },
    ]);
    setActiveProjectId(newId);
    restoreSnapshot(null); // fresh empty state
  }
 
  function removeProject(id) {
    if (projects.length <= 1) return; // can't remove last
    const remaining = projects.filter(p => p.id !== id);
    setProjects(remaining);
    if (id === activeProjectId) {
      const fallback = remaining[0];
      setActiveProjectId(fallback.id);
      restoreSnapshot(fallback.snapshot || null);
    }
  }
 
  function commitRename() {
    const val = renameVal.trim();
    if (val) setProjects(prev => prev.map(p => p.id === renamingId ? { ...p, name: val } : p));
    setRenamingId(null);
  }
 
  const masterTagSet = useMemo(() =>
    masterFile ? new Set(masterFile.tags.keys()) : new Set(), [masterFile]);
 
  const allContentTags = useMemo(() => {
    const map = new Map(); // tag -> [{ fileIndex, fileName, rowIndices: number[] }]
    contentFiles.forEach((file, fi) => {
      file.rows.slice(1).forEach((row, ri) => {
        parseTags(row[colIdx] || '').forEach(tag => {
          if (!map.has(tag)) map.set(tag, []);
          const entries = map.get(tag);
          const existing = entries.find(e => e.fileIndex === fi);
          if (existing) {
            existing.rowIndices.push(ri + 1);
          } else {
            entries.push({ fileIndex: fi, fileName: file.name, rowIndices: [ri + 1] });
          }
        });
      });
    });
    return map;
  }, [contentFiles, colIdx]);
 
  // Column detection: for a tag, find which OTHER columns (besides colIdx) it appears in.
  // Parses each cell as pipe-delimited tags — O(cells) not O(tags × cells).
  const tagColumnMap = useMemo(() => {
    const map = new Map(); // tag -> Set of col indices
    contentFiles.forEach(file => {
      file.rows.slice(1).forEach(row => {
        row.forEach((cell, ci) => {
          if (ci === colIdx || !cell) return;
          parseTags(String(cell)).forEach(tag => {
            if (!map.has(tag)) map.set(tag, new Set());
            map.get(tag).add(ci);
          });
        });
      });
    });
    return map;
  }, [contentFiles, colIdx]);
 
  // Returns header name if available, otherwise falls back to column letter
  function colLetter(i) {
    const letter = String.fromCharCode(65 + i);
    const hdr = columnHeaders[i];
    return hdr ? hdr : letter;
  }
  function colLetterWithFallback(i) {
    const letter = String.fromCharCode(65 + i);
    const hdr = columnHeaders[i];
    return hdr ? `${hdr} (${letter})` : letter;
  }
 
  // Tags that will be in master after export because a master entry is being renamed to them.
  // e.g. master has "The University of New Mexico", user sets replacement → "University of New Mexico"
  // Content cells also containing "University of New Mexico" would wrongly appear as missing without this.
  const renamedMasterTags = useMemo(() => {
    if (!masterFile) return new Set();
    const s = new Set();
    masterFile.tags.forEach((_, masterTag) => {
      const dest = replacements.get(masterTag);
      if (!dest || dest === DELETE_SENTINEL) return;
      // Expand splits too — each part will exist in master after export
      parseTags(dest).forEach(part => s.add(part));
    });
    return s;
  }, [masterFile, replacements]);
 
  const missingTags = useMemo(() => {
    const out = [];
    allContentTags.forEach((occurrences, tag) => {
      if (!masterTagSet.has(tag) && !renamedMasterTags.has(tag)) out.push({ tag, occurrences });
    });
    return out.sort((a, b) =>
      b.occurrences.reduce((s, o) => s + o.rowIndices.length, 0) -
      a.occurrences.reduce((s, o) => s + o.rowIndices.length, 0)
    );
  }, [allContentTags, masterTagSet, renamedMasterTags]);
 
  const effectiveMissingTags = useMemo(() => {
    const seen = new Set();
    const result = [];
    missingTags.forEach(({ tag, occurrences }) => {
      const dest = replacements.get(tag);
      if (dest === DELETE_SENTINEL) return; // deleted → skip
 
      if (dest && dest.includes('|')) {
        // Split replacement — expand into individual parts, check each separately
        parseTags(dest).forEach(part => {
          if (masterTagSet.has(part)) return;
          if (renamedMasterTags.has(part)) return;
          if (addedTags.has(part)) return;
          if (seen.has(part)) return;
          seen.add(part);
          result.push({ tag: part, renamedFrom: tag, occurrences });
        });
        return;
      }
 
      const effectiveTag = dest || tag;
      if (masterTagSet.has(effectiveTag)) return;
      if (renamedMasterTags.has(effectiveTag)) return;
      if (addedTags.has(effectiveTag)) return;
      if (seen.has(effectiveTag)) return;
      seen.add(effectiveTag);
      // renamedFrom: the original tag name before replacement (null if no rename pending)
      result.push({ tag: effectiveTag, renamedFrom: dest ? tag : null, occurrences });
    });
    return result.sort((a, b) =>
      b.occurrences.reduce((s, o) => s + o.rowIndices.length, 0) -
      a.occurrences.reduce((s, o) => s + o.rowIndices.length, 0)
    );
  }, [missingTags, replacements, masterTagSet, renamedMasterTags, addedTags]);
 
  const unsafeTags = useMemo(() => {
    const out = [];
    allContentTags.forEach((occurrences, tag) => {
      if (!isURLSafe(tag)) out.push({ tag, unsafeChars: getUnsafeChars(tag), occurrences });
    });
    return out;
  }, [allContentTags]);
 
  // Compute variation groups asynchronously so the UI stays responsive.
  // With 35 sheets this can take ~1-2 s; deferring it avoids freezing Firefox.
  const [variationGroups,    setVariationGroups]    = useState([]);
  const [variationsLoading,  setVariationsLoading]  = useState(false);
  useEffect(() => {
    if (!parsed) { setVariationGroups([]); return; }
    setVariationsLoading(true);
    const tags = [...allContentTags.keys()];
    const id = setTimeout(() => {
      setVariationGroups(buildVariationGroups(tags));
      setVariationsLoading(false);
    }, 0);
    return () => clearTimeout(id);
  }, [allContentTags, parsed]);
 
  // Dupe/whitespace count for the tab badge — computed async so it doesn't block Analyze.
  const [dupeCount, setDupeCount] = useState(0);
  useEffect(() => {
    if (!parsed) { setDupeCount(0); return; }
    const id = setTimeout(() => {
      setDupeCount(
        findDuplicateRows(contentFiles, colIdx).length +
        findWhitespaceTags(contentFiles, colIdx).length
      );
    }, 50);
    return () => clearTimeout(id);
  }, [contentFiles, colIdx, parsed]);
 
  // ── HANDLERS ──────────────────────────────────────────────────────────────
 
  function addHistory(item) {
    setHistory(prev => [...prev, { ...item, id: ++historyId.current, ts: Date.now() }]);
  }
 
  function handleParsed(master, content, ci, savedState) {
    // savedState: optional { replacements, masterTagsToAdd, addedTags, history }
    //   — provided when restoring from a saved session so we don't wipe decisions
    setMasterFile(master); setMasterRows(master.rows);
    setContentFiles(content); setColIdx(ci); setParsed(true);
    if (savedState) {
      setReplacements(savedState.replacements || new Map());
      setMasterTagsToAdd(savedState.masterTagsToAdd || []);
      setAddedTags(savedState.addedTags || new Set());
      setHistory(savedState.history || []);
    } else {
      setReplacements(new Map());
      setMasterTagsToAdd([]);
      setAddedTags(new Set());
      setHistory([]);
    }
    setVarResolved(new Set());
    setUndoStack([]); setRedoStack([]);
    setTab('dupes');
    // Extract column headers from first content sheet's row 0
    const hdrRow = content[0]?.rows[0] || [];
    const hdrs = {};
    hdrRow.forEach((h, i) => { if (h) hdrs[i] = String(h).trim(); });
    setColumnHeaders(hdrs);
    // Auto-name the active project from the content files (only for fresh uploads, not session restores)
    if (!savedState && content.length > 0) {
      const autoName = content[0].name
        .replace(/\.(csv|tsv|xlsx?)$/i, '')
        .replace(/_\d+$/, '')           // strip trailing _012
        .replace(/_/g, ' ')
        .trim() || 'Project';
      setProjects(prev => prev.map(p =>
        p.id === activeProjectId ? { ...p, name: autoName } : p
      ));
    }
  }
 
  // Snapshot helper — captures both replacements and varResolved for undo
  const resolvedRef = useRef(varResolved);
  useEffect(() => { resolvedRef.current = varResolved; }, [varResolved]);
 
  function handleSetReplacement(from, to) {
    setReplacements(prev => {
      setUndoStack(u => [...u, { replacements: new Map(prev), varResolved: new Set(resolvedRef.current) }]);
      setRedoStack([]);
      const n = new Map(prev); n.set(from, to); return n;
    });
    addHistory(to === DELETE_SENTINEL ? { type: 'delete', from } : { type: 'replace', from, to });
  }
 
  // Per-item undo (from history panel) — removes one specific replacement
  function handleUndo(id) {
    const item = history.find(h => h.id === id);
    if (!item) return;
    if (item.type === 'replace' || item.type === 'delete') {
      setReplacements(prev => {
        setUndoStack(u => [...u, { replacements: new Map(prev), varResolved: new Set(resolvedRef.current) }]);
        setRedoStack([]);
        const n = new Map(prev); n.delete(item.from); return n;
      });
    }
    setHistory(prev => prev.filter(h => h.id !== id));
  }
 
  // Global undo (Ctrl+Z) — restores replacements AND variation tab resolved state
  function handleGlobalUndo() {
    setUndoStack(prev => {
      if (!prev.length) return prev;
      const snapshot = prev[prev.length - 1];
      const rest     = prev.slice(0, -1);
      setReplacements(current => {
        setRedoStack(r => [...r, { replacements: new Map(current), varResolved: new Set(resolvedRef.current) }]);
        return new Map(snapshot.replacements);
      });
      setVarResolved(new Set(snapshot.varResolved));
      return rest;
    });
  }
 
  // Global redo (Ctrl+Y / Ctrl+Shift+Z)
  function handleGlobalRedo() {
    setRedoStack(prev => {
      if (!prev.length) return prev;
      const snapshot = prev[prev.length - 1];
      const rest     = prev.slice(0, -1);
      setReplacements(current => {
        setUndoStack(u => [...u, { replacements: new Map(current), varResolved: new Set(resolvedRef.current) }]);
        return new Map(snapshot.replacements);
      });
      setVarResolved(new Set(snapshot.varResolved));
      return rest;
    });
  }
 
  // Keyboard shortcuts
  useEffect(() => {
    function onKey(e) {
      const ctrl = e.ctrlKey || e.metaKey;
      if (!ctrl) return;
      if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); handleGlobalUndo(); }
      if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); handleGlobalRedo(); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undoStack, redoStack]);
 
  function handleAddToMaster(tag, group, renamedFrom) {
    setMasterTagsToAdd(prev => [...prev, { tag, group: group || '', renamedFrom: renamedFrom || null }]);
    setAddedTags(prev => new Set([...prev, tag]));
    setMasterFile(prev => {
      if (!prev) return prev;
      const newTags = new Map(prev.tags); newTags.set(tag, group || '');
      return { ...prev, tags: newTags };
    });
    addHistory({ type: 'add-master', tag, group });
  }
 
  function handleDupeFix(fileIndex, rowIndex, deduped) {
    setContentFiles(prev => {
      const next = [...prev];
      const file = { ...next[fileIndex], rows: [...next[fileIndex].rows] };
      file.rows[rowIndex] = [...file.rows[rowIndex]];
      file.rows[rowIndex][colIdx] = deduped.join(' | ');
      next[fileIndex] = file;
      return next;
    });
    addHistory({ type: 'fix-dupe', detail: `Row ${rowIndex} in ${contentFiles[fileIndex]?.name}` });
  }
 
  function handleWsFix(raw, trimmed) {
    setReplacements(prev => { const n = new Map(prev); n.set(raw, trimmed); return n; });
    addHistory({ type: 'trim-ws', detail: `"${raw}" → "${trimmed}"` });
  }
 
  // ── SAVE / LOAD SESSION ───────────────────────────────────────────────────
 
  function snapshotToJson(snap) {
    if (!snap || !snap.parsed) return null;
    return {
      tab:             snap.tab,
      colIdx:          snap.colIdx,
      replacements:    [...(snap.replacements?.entries() || [])],
      masterTagsToAdd: snap.masterTagsToAdd || [],
      addedTags:       [...(snap.addedTags || [])],
      history:         snap.history || [],
      masterFileData: snap.masterFile ? {
        name:   snap.masterFile.name,
        rows:   snap.masterFile.rows,
        tags:   [...snap.masterFile.tags.entries()],
        groups: snap.masterFile.groups,
      } : null,
      contentFilesData: (snap.contentFiles || []).map(f => ({ name: f.name, rows: f.rows })),
    };
  }
 
  function jsonToSnapshot(d) {
    if (!d || !d.masterFileData) return null;
    const ci = d.colIdx ?? DEFAULT_TAG_COL;
    const master = {
      name:   d.masterFileData.name,
      rows:   d.masterFileData.rows,
      tags:   new Map(d.masterFileData.tags),
      groups: d.masterFileData.groups || [],
    };
    const contentFiles = (d.contentFilesData || []).map(f => {
      const tagSet = new Set();
      f.rows.slice(1).forEach(row => parseTags(row[ci] || '').forEach(t => tagSet.add(t)));
      return { name: f.name, rows: f.rows, tags: tagSet };
    });
    return {
      tab:             d.tab || 'dupes',
      masterFile:      master,
      masterRows:      master.rows,
      contentFiles,
      colIdx:          ci,
      parsed:          true,
      columnHeaders:   (() => { const h = {}; (contentFiles[0]?.rows[0] || []).forEach((v, i) => { if (v) h[i] = String(v).trim(); }); return h; })(),
      replacements:    new Map(d.replacements || []),
      varResolved:     new Set(),
      masterTagsToAdd: d.masterTagsToAdd || [],
      addedTags:       new Set(d.addedTags || []),
      history:         d.history || [],
      undoStack:       [],
      redoStack:       [],
    };
  }
 
  function saveSession() {
    // Save all projects (snapshot current project first)
    const currentSnap = captureSnapshot();
    const allProjects = projects.map(p =>
      p.id === activeProjectId ? { ...p, snapshot: currentSnap } : p
    );
    const data = {
      version: 3,
      activeProjectId,
      projects: allProjects.map(p => ({
        id:       p.id,
        name:     p.name,
        data:     snapshotToJson(p.snapshot),
      })),
    };
    const blob = new Blob([JSON.stringify(data), '\n'], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a'); a.href = url;
    a.download = 'avannotate-session.json'; a.click();
    URL.revokeObjectURL(url);
  }
 
  function loadSession(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
 
        // v3: multi-project session
        if ((data.version || 0) >= 3 && data.projects) {
          const restoredProjects = data.projects.map(p => ({
            id:       p.id,
            name:     p.name,
            snapshot: p.data ? jsonToSnapshot(p.data) : null,
          }));
          const activeId = data.activeProjectId || restoredProjects[0]?.id;
          const activeSnap = restoredProjects.find(p => p.id === activeId)?.snapshot || null;
          setProjects(restoredProjects);
          setActiveProjectId(activeId);
          restoreSnapshot(activeSnap);
          return;
        }
 
        // v2: single-project session with file data
        if ((data.version || 0) >= 2 && data.masterFileData && data.contentFilesData) {
          const snap = jsonToSnapshot(data);
          if (snap) {
            // Wrap in a single project
            const newId = `proj-${++projIdRef.current}`;
            setProjects([{ id: newId, name: 'Restored Project', snapshot: snap }]);
            setActiveProjectId(newId);
            restoreSnapshot(snap);
          }
          return;
        }
 
        // v1 fallback: decisions only
        if (!parsed) {
          alert('This is an older session file that doesn\'t include your sheets.\nPlease upload your master and content sheets first, then load this session.');
          return;
        }
        if (data.replacements)    setReplacements(new Map(data.replacements));
        if (data.masterTagsToAdd) setMasterTagsToAdd(data.masterTagsToAdd);
        if (data.addedTags)       setAddedTags(new Set(data.addedTags));
        if (data.history)         setHistory(data.history);
      } catch(err) { alert('Could not load session file: ' + (err.message || err)); }
    };
    reader.readAsText(file);
  }
 
  // ── TABS ──────────────────────────────────────────────────────────────────
 
  const tabs = [
    { id: 'upload',    label: '① Upload' },
    { id: 'dupes',     label: '② Duplicates',    count: parsed ? dupeCount                   : null, enabled: parsed },
    { id: 'variations',label: '③ Variations',    count: parsed ? variationGroups.length      : null, enabled: parsed },
    { id: 'manual',    label: '④ Manual Edit',                                                        enabled: parsed },
    { id: 'safety',    label: '⑤ URL Safety',    count: parsed ? unsafeTags.length           : null, enabled: parsed },
    { id: 'cooccur',   label: '⑥ Co-occurrence',                                                      enabled: parsed },
    { id: 'coverage',  label: '⑦ Coverage',                                                          enabled: parsed },
    { id: 'alltags',   label: '⑧ All Tags',      count: parsed ? allContentTags.size         : null, enabled: parsed },
    { id: 'missing',   label: '⑨ Missing Tags',  count: parsed ? effectiveMissingTags.length : null, enabled: parsed },
    { id: 'preview',   label: '⑩ Preview',                                                           enabled: parsed },
    { id: 'export',    label: '⑪ Export',                                                            enabled: parsed },
  ].map(t => ({ ...t, enabled: t.enabled !== false }));
 
  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <header style={{ background: '#1C1C1C', padding: '0 20px', height: 54, display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0 }}>
        <span style={{ color: BRAND, fontWeight: 800, fontSize: 17, letterSpacing: '-0.3px' }}>AVAnnotate</span>
        <span style={{ color: '#555', fontSize: 13 }}>Tag Cleaner</span>
 
        {parsed && (
          <div style={{ display: 'flex', gap: 6, marginLeft: 8 }}>
            <span style={{ ...S.badge('teal'),   fontSize: 10 }}>{contentFiles.length} sheets</span>
            <span style={{ ...S.badge('orange'), fontSize: 10 }}>{allContentTags.size} tags</span>
            <span style={{ ...S.badge('gray'),   fontSize: 10 }}>{masterTagSet.size} master</span>
          </div>
        )}
 
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
          {parsed && (
            <>
              {/* Undo / Redo */}
              <button onClick={handleGlobalUndo} disabled={!undoStack.length} title="Undo (Ctrl+Z)"
                style={{ ...S.btn('ghost'), fontSize: 13, color: undoStack.length ? '#DDD' : '#555', border: '1px solid #333', padding: '6px 10px', opacity: undoStack.length ? 1 : 0.4 }}>
                ↩
              </button>
              <button onClick={handleGlobalRedo} disabled={!redoStack.length} title="Redo (Ctrl+Y)"
                style={{ ...S.btn('ghost'), fontSize: 13, color: redoStack.length ? '#DDD' : '#555', border: '1px solid #333', padding: '6px 10px', opacity: redoStack.length ? 1 : 0.4 }}>
                ↪
              </button>
              {/* Save session */}
              <button onClick={saveSession} style={{ ...S.btn('ghost'), fontSize: 11, color: '#AAA', border: '1px solid #333' }}>
                💾 Save session
              </button>
            </>
          )}
          {/* Load session — always visible so you can restore after re-uploading sheets */}
          <button onClick={() => saveInputRef.current?.click()}
            style={{ ...S.btn('ghost'), fontSize: 11, color: parsed ? '#AAA' : BRAND, border: `1px solid ${parsed ? '#333' : BRAND}` }}
            title={parsed ? 'Restore a previously saved session' : 'Upload your sheets first, then load your session'}>
            📂 Load session
          </button>
          <input ref={saveInputRef} type="file" accept=".json" style={{ display: 'none' }}
            onChange={e => {
              if (e.target.files[0]) loadSession(e.target.files[0]);
              e.target.value = '';
            }} />
          {parsed && (
            <button onClick={() => setShowHistory(x => !x)}
              style={{ ...S.btn('ghost'), fontSize: 11, color: showHistory ? BRAND : '#AAA', border: `1px solid ${showHistory ? BRAND : '#333'}` }}>
              🕓 History ({history.length})
            </button>
          )}
        </div>
      </header>
 
      {/* Project switcher bar */}
      <div style={{
        background: '#141414', borderBottom: '1px solid #2A2A2A',
        display: 'flex', alignItems: 'center', padding: '0 16px', gap: 2, overflowX: 'auto',
        flexShrink: 0, height: 36,
      }}>
        {projects.map(proj => {
          const isActive = proj.id === activeProjectId;
          const isRenaming = renamingId === proj.id;
          return (
            <div key={proj.id} style={{
              display: 'flex', alignItems: 'center', gap: 5,
              padding: '0 10px', height: 36, cursor: 'pointer',
              borderBottom: isActive ? `2px solid ${BRAND}` : '2px solid transparent',
              background: isActive ? '#1E1E1E' : 'transparent',
              flexShrink: 0,
            }} onClick={() => !isRenaming && switchProject(proj.id)}>
              {isRenaming ? (
                <input
                  autoFocus
                  value={renameVal}
                  onChange={e => setRenameVal(e.target.value)}
                  onBlur={commitRename}
                  onKeyDown={e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') setRenamingId(null); }}
                  onClick={e => e.stopPropagation()}
                  style={{ background: '#333', border: `1px solid ${BRAND}`, borderRadius: 4, color: '#FFF', fontSize: 12, padding: '2px 6px', width: 120 }}
                />
              ) : (
                <span
                  onDoubleClick={e => { e.stopPropagation(); setRenamingId(proj.id); setRenameVal(proj.name); }}
                  title="Double-click to rename"
                  style={{ fontSize: 12, color: isActive ? '#FFF' : '#777', fontWeight: isActive ? 600 : 400, userSelect: 'none' }}>
                  {proj.name}
                  {proj.snapshot?.parsed && !isActive && (
                    <span style={{ marginLeft: 5, width: 6, height: 6, borderRadius: '50%', background: BRAND, display: 'inline-block', verticalAlign: 'middle' }} title="Has data" />
                  )}
                </span>
              )}
              {projects.length > 1 && !isRenaming && (
                <button
                  onClick={e => { e.stopPropagation(); if (window.confirm(`Close "${proj.name}"?`)) removeProject(proj.id); }}
                  title="Close project"
                  style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#555', fontSize: 13, lineHeight: 1, padding: '1px 2px', marginLeft: 2 }}
                  onMouseEnter={e => e.currentTarget.style.color = '#EEE'}
                  onMouseLeave={e => e.currentTarget.style.color = '#555'}
                >×</button>
              )}
            </div>
          );
        })}
        {/* New project button */}
        <button onClick={addProject}
          title="New project"
          style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#555', fontSize: 18, lineHeight: 1, padding: '0 8px', flexShrink: 0, height: 36 }}
          onMouseEnter={e => e.currentTarget.style.color = BRAND}
          onMouseLeave={e => e.currentTarget.style.color = '#555'}
        >+</button>
      </div>
 
      <TabBar tabs={tabs} active={tab} onChange={setTab} />
 
      <main style={{ flex: 1, overflowY: 'auto', marginRight: showHistory ? 340 : 0, transition: 'margin-right .2s' }}>
        {/* All tabs stay mounted once parsed — CSS show/hide preserves local state across tab switches */}
        <div style={{ display: tab === 'upload' ? 'block' : 'none' }}>
          <UploadTab onParsed={handleParsed} />
        </div>
        {parsed && <>
          <div style={{ display: tab === 'dupes' ? 'block' : 'none' }}>
            <DuplicatesTab
              contentFiles={contentFiles} colIdx={colIdx}
              onFixApplied={(type, ...args) => {
                if (type === 'dupe')            handleDupeFix(...args);
                else if (type === 'whitespace') handleWsFix(...args);
              }}
            />
          </div>
          <div style={{ display: tab === 'variations' ? 'block' : 'none' }}>
            <VariationsTab variationGroups={variationGroups} allContentTags={allContentTags}
              masterTagSet={masterTagSet} renamedMasterTags={renamedMasterTags}
              replacements={replacements} onSetReplacement={handleSetReplacement}
              resolved={varResolved} onResolve={setVarResolved}
              loading={variationsLoading}
              onRerun={() => {
                setVariationsLoading(true);
                setTimeout(() => {
                  setVariationGroups(buildVariationGroups([...allContentTags.keys()]));
                  setVariationsLoading(false);
                }, 0);
              }} />
          </div>
          <div style={{ display: tab === 'manual' ? 'block' : 'none' }}>
            <ManualEditTab allContentTags={allContentTags} masterTagSet={masterTagSet}
              replacements={replacements} onSetReplacement={handleSetReplacement} />
          </div>
          <div style={{ display: tab === 'safety' ? 'block' : 'none' }}>
            <URLSafetyTab unsafeTags={unsafeTags} replacements={replacements} onSetReplacement={handleSetReplacement} />
          </div>
          <div style={{ display: tab === 'cooccur' ? 'block' : 'none' }}>
            <CooccurrenceTab contentFiles={contentFiles} colIdx={colIdx} />
          </div>
          <div style={{ display: tab === 'coverage' ? 'block' : 'none' }}>
            <CoverageTab contentFiles={contentFiles} colIdx={colIdx} masterTagSet={masterTagSet} />
          </div>
          <div style={{ display: tab === 'alltags' ? 'block' : 'none' }}>
            <AllTagsTab allContentTags={allContentTags} masterFile={masterFile}
              replacements={replacements} onSetReplacement={handleSetReplacement} />
          </div>
          <div style={{ display: tab === 'missing' ? 'block' : 'none' }}>
            <MissingTab
              missingTags={effectiveMissingTags}
              masterGroups={masterFile?.groups || []}
              onAddToMaster={handleAddToMaster}
              addedTags={addedTags}
              tagColumnMap={tagColumnMap}
              colLetter={colLetter}
            />
          </div>
          <div style={{ display: tab === 'preview' ? 'block' : 'none' }}>
            <PreviewTab contentFiles={contentFiles} colIdx={colIdx} replacements={replacements}
              masterTagSet={masterTagSet} allContentTags={allContentTags}
              onSetReplacement={handleSetReplacement} />
          </div>
          <div style={{ display: tab === 'export' ? 'block' : 'none' }}>
            <ExportTab contentFiles={contentFiles} masterFile={masterFile} masterRows={masterRows}
              masterTagsToAdd={masterTagsToAdd} replacements={replacements} colIdx={colIdx} />
          </div>
        </>}
      </main>
 
      {showHistory && (
        <HistoryPanel history={history} onUndo={handleUndo} onClose={() => setShowHistory(false)} />
      )}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App, null));
</script>
</body>
</html>
