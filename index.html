              </div>
              <div style={{ fontSize: 12, color: '#888', marginTop: 6 }}>
                {sheetsFor(selected).slice(0, 5).join(', ')}
                {sheetsFor(selected).length > 5 && ` +${sheetsFor(selected).length - 5} more`}
                {' · '}{usageCount(selected)} usage{usageCount(selected) !== 1 ? 's' : ''}
              </div>
            </div>
 
            {/* Mode tabs */}
            <div style={{ display: 'flex', borderBottom: '2px solid #ECEAE6', marginBottom: 16 }}>
              {[['replace', '✏️ Replace'], ['split', '✂️ Split']].map(([m, label]) => (
                <button key={m} onClick={() => setEditMode(m)}
                  style={{
                    background: 'none', border: 'none', cursor: 'pointer',
                    padding: '6px 14px', fontSize: 13, fontWeight: editMode === m ? 700 : 400,
                    color: editMode === m ? BRAND_DARK : '#888',
                    borderBottom: editMode === m ? `2px solid ${BRAND}` : '2px solid transparent',
                    marginBottom: -2,
                  }}>
                  {label}
                </button>
              ))}
            </div>
 
            {/* ── REPLACE MODE ── */}
            {editMode === 'replace' && (<>
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#AAA', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 5 }}>
                  Replace with
                </div>
                <AutocompleteInput
                  value={replacement}
                  onChange={setReplacement}
                  onEnter={handleApply}
                  masterTagSet={masterTagSet}
                  allTagsList={allTags}
                  placeholder="Type or pick a tag…"
                  style={{ ...S.input, fontFamily: 'monospace', fontSize: 14, fontWeight: 600 }}
                />
                {!isURLSafe(replacement.trim()) && replacement.trim() && (
                  <div style={{ color: '#E65100', fontSize: 12, marginTop: 5 }}>
                    ⚠️ Replacement contains unsafe URL characters: {getUnsafeChars(replacement.trim()).map(c => `"${c}"`).join(', ')}
                  </div>
                )}
              </div>
              <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
                <button onClick={handleApply}
                  disabled={!replacement.trim() || replacement.trim() === selected}
                  style={{ ...S.btn('primary'), flex: 1, justifyContent: 'center', opacity: (replacement.trim() && replacement.trim() !== selected) ? 1 : 0.4 }}>
                  Apply replacement →
                </button>
                <button onClick={() => { setSelected(null); setReplacement(''); setConfirmDelete(false); }}
                  style={{ ...S.btn('ghost'), color: '#999' }}>Cancel</button>
              </div>
              {!confirmDelete ? (
                <button onClick={() => setConfirmDelete(true)}
                  style={{ ...S.btn('danger'), width: '100%', justifyContent: 'center', fontSize: 12 }}>
                  🗑 Delete tag from all sheets
                </button>
              ) : (
                <div style={{ background: '#FFF3E0', border: '1.5px solid #FFAB91', borderRadius: 8, padding: '12px 14px' }}>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, color: '#BF360C' }}>
                    Remove "{selected}" from every sheet?
                  </div>
                  <div style={{ fontSize: 12, color: '#777', marginBottom: 10 }}>
                    This will strip the tag from all {usageCount(selected)} cell{usageCount(selected) !== 1 ? 's' : ''} across {sheetsFor(selected).length} sheet{sheetsFor(selected).length !== 1 ? 's' : ''} when you export.
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={handleDelete}
                      style={{ ...S.btn('danger'), flex: 1, justifyContent: 'center', background: '#FFCCBC', fontWeight: 700 }}>
                      Yes, delete it
                    </button>
                    <button onClick={() => setConfirmDelete(false)}
                      style={{ ...S.btn('ghost'), color: '#999' }}>No, keep it</button>
                  </div>
                </div>
              )}
              {replacements.get(selected) && replacements.get(selected) !== DELETE_SENTINEL && (
                <div style={{ marginTop: 10, fontSize: 12, color: '#888', background: '#F5F5F5', padding: '8px 10px', borderRadius: 6 }}>
                  Previously queued: <strong>{replacements.get(selected)}</strong>. Applying again will overwrite it.
                </div>
              )}
              {replacements.get(selected) === DELETE_SENTINEL && (
                <div style={{ marginTop: 10, fontSize: 12, color: '#BF360C', background: '#FBE9E7', padding: '8px 10px', borderRadius: 6 }}>
                  ⚠ This tag is already queued for deletion.
                </div>
              )}
            </>)}
 
            {/* ── SPLIT MODE ── */}
            {editMode === 'split' && (() => {
              const parts = splitValue.split('|').map(p => p.trim()).filter(Boolean);
              const canApply = parts.length >= 2 && parts.every(p => p.length > 0);
              return (<>
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: '#AAA', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 5 }}>
                    Edit — insert <code style={{ background:'#F0F0F0', padding:'1px 5px', borderRadius:3, fontSize:11 }}>|</code> to mark where to split
                  </div>
                  <textarea
                    value={splitValue}
                    onChange={e => setSplitValue(e.target.value)}
                    rows={3}
                    style={{ ...S.input, fontFamily: 'monospace', fontSize: 13, fontWeight: 600, resize: 'vertical', lineHeight: 1.5 }}
                  />
                  <div style={{ fontSize: 11, color: '#AAA', marginTop: 4 }}>
                    Tip: position your cursor where you want to split and type <strong>|</strong>
                  </div>
                </div>
 
                {/* Live preview */}
                <div style={{ marginBottom: 16 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: '#AAA', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 8 }}>
                    Preview — {parts.length} tag{parts.length !== 1 ? 's' : ''} after split
                  </div>
                  {parts.length === 0 ? (
                    <div style={{ color: '#CCC', fontSize: 12 }}>No tags yet</div>
                  ) : (
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                      {parts.map((p, i) => {
                        const inMaster = masterTagSet && masterTagSet.has(p);
                        const unsafe   = !isURLSafe(p);
                        return (
                          <span key={i} style={{
                            background: unsafe ? '#FBE9E7' : inMaster ? BRAND_LIGHT : '#F0F0F0',
                            border: `1px solid ${unsafe ? '#FFAB91' : inMaster ? BRAND : '#DDD'}`,
                            borderRadius: 6, padding: '4px 10px',
                            fontFamily: 'monospace', fontSize: 12, fontWeight: 600,
                            color: unsafe ? '#C62828' : inMaster ? BRAND_DARK : '#333',
                          }}>
                            {p}
                            {inMaster && <span style={{ marginLeft: 4, fontSize: 10 }}>★</span>}
                            {unsafe && <span style={{ marginLeft: 4, fontSize: 10 }}>⚠</span>}
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
 
                <div style={{ display: 'flex', gap: 8 }}>
                  <button onClick={handleApplySplit} disabled={!canApply}
                    style={{ ...S.btn('primary'), flex: 1, justifyContent: 'center', opacity: canApply ? 1 : 0.4 }}>
                    ✂️ Apply split ({parts.length} tags)
                  </button>
                  <button onClick={() => { setSelected(null); setSplitValue(''); }}
                    style={{ ...S.btn('ghost'), color: '#999' }}>Cancel</button>
                </div>
              </>);
            })()}
 
          </div>
        )}
      </div>
 
      {/* Applied in this session */}
      {applied.size > 0 && (
        <div style={{ ...S.card, marginTop: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10 }}>
            Applied this session ({applied.size})
          </div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {[...applied].map(tag => {
              const dest = replacements.get(tag);
              const isDeleted = dest === DELETE_SENTINEL;
              return (
                <div key={tag} style={{ display:'flex', alignItems:'center', gap:5, background: isDeleted ? '#FBE9E7' : '#F8F6F2', borderRadius:6, padding:'4px 10px', fontSize:12 }}>
                  <span style={{ fontFamily:'monospace', color:'#C62828', textDecoration:'line-through' }}>{tag}</span>
                  {isDeleted
                    ? <span style={{ color:'#BF360C', fontWeight:700 }}>deleted</span>
                    : <><span style={{ color:'#AAA' }}>→</span>
                       <span style={{ fontFamily:'monospace', color:'#2E7D32', fontWeight:600 }}>{dest}</span></>
                  }
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
 
// Highlight matching substring
function HighlightMatch({ text, query }) {
  if (!query) return <span style={{ fontFamily:'monospace', fontWeight:600, fontSize:13 }}>{text}</span>;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return <span style={{ fontFamily:'monospace', fontWeight:600, fontSize:13 }}>{text}</span>;
  return (
    <span style={{ fontFamily:'monospace', fontWeight:600, fontSize:13 }}>
      {text.slice(0, idx)}
      <mark style={{ background: '#FFE082', borderRadius:2, padding:'0 1px' }}>
        {text.slice(idx, idx + query.length)}
      </mark>
      {text.slice(idx + query.length)}
    </span>
  );
}
 
// ─── URL SAFETY TAB ───────────────────────────────────────────────────────────
function URLSafetyTab({ unsafeTags, replacements, onSetReplacement }) {
  const [fixes, setFixes] = useState(() => {
    const m = {};
    unsafeTags.forEach(({ tag }) => {
      m[tag] = tag.replace(/[^a-zA-Z\u00C0-\u024F0-9\s\-]/g, '').replace(/\s+/g,' ').trim();
    });
    return m;
  });
  const [dismissed,    setDismissed]    = useState(new Set());
  const [showIgnored,  setShowIgnored]  = useState(false);
 
  useEffect(() => {
    setFixes(prev => {
      const m = { ...prev };
      unsafeTags.forEach(({ tag }) => {
        if (!(tag in m)) m[tag] = tag.replace(/[^a-zA-Z\u00C0-\u024F0-9\s\-]/g,'').replace(/\s+/g,' ').trim();
      });
      return m;
    });
  }, [unsafeTags]);
 
  return (
    <div style={{ maxWidth: 1020, margin: '0 auto', padding: '32px 28px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <h2 style={{ fontSize:22, fontWeight:800 }}>URL Safety Check</h2>
        <button
          onClick={() => setDismissed(new Set())}
          style={{ ...S.btn('ghost'), fontSize:12, color: BRAND_DARK, border:`1px solid ${BRAND}` }}
          title="Re-scan: clears ignored tags so you can re-evaluate them">
          🔄 Re-scan
        </button>
      </div>
      <p style={{ color:'#666', fontSize:14, marginBottom:20, lineHeight:1.5 }}>
        Tags must only contain letters (including accented), digits, spaces, and dashes.
        The fields below are pre-filled with a suggested safe version — edit if needed.
      </p>
 
      {dismissed.size > 0 && (
        <div style={{ marginBottom: 12 }}>
          <button onClick={() => setShowIgnored(x => !x)}
            style={{ ...S.btn('ghost'), fontSize:12, color:'#999' }}>
            {showIgnored ? 'Hide' : 'Show'} ignored ({dismissed.size})
          </button>
        </div>
      )}
 
      {unsafeTags.filter(t => !dismissed.has(t.tag) || showIgnored).length === 0 ? (
        <div style={{ textAlign:'center', padding:'64px 0', color:'#888' }}>
          ✅ All tags pass the URL safety check!
        </div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {unsafeTags.map(({ tag, unsafeChars, occurrences }) => {
            const uses       = occurrences.reduce((s, o) => s + o.rowIndices.length, 0);
            const applied    = replacements.get(tag);
            const fix        = fixes[tag] ?? '';
            const isIgnored  = dismissed.has(tag);
            if (isIgnored && !showIgnored) return null;
            return (
              <div key={tag} style={{
                ...S.card,
                borderLeft: `4px solid ${isIgnored ? '#DDD' : applied ? '#A5D6A7' : '#FFAB91'}`,
                padding: '16px 20px',
                opacity: isIgnored ? 0.5 : 1,
              }}>
                <div style={{ display:'flex', gap:16, alignItems:'center', flexWrap:'wrap' }}>
                  <div style={{ flex:1, minWidth:200 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6 }}>
                      <span style={{ fontFamily:'monospace', fontWeight:700, fontSize:14 }}>{tag}</span>
                      {unsafeChars.map(c => (
                        <span key={c} style={S.badge('red')}>"{c}"</span>
                      ))}
                      <span style={S.badge('blue')}>{uses} use{uses !== 1 ? 's' : ''}</span>
                      {isIgnored && <span style={S.badge('gray')}>Ignored</span>}
                    </div>
                    {!isIgnored && (applied ? (
                      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                        <span style={S.badge('green')}>✓ Will be replaced with:</span>
                        <code style={{ fontFamily:'monospace', fontSize:13, color:'#2E7D32' }}>{applied}</code>
                      </div>
                    ) : (
                      <div style={{ display:'flex', gap:8, alignItems:'center', marginTop:6 }}>
                        <input
                          style={{ ...S.input, fontFamily:'monospace', fontSize:13 }}
                          value={fix}
                          onChange={e => setFixes(p => ({ ...p, [tag]: e.target.value }))}
                          onKeyDown={e => { if (e.key === 'Enter' && fix.trim() && fix !== tag) onSetReplacement(tag, fix.trim()); }}
                          placeholder="Safe replacement…"
                        />
                        <button
                          onClick={() => onSetReplacement(tag, fix.trim())}
                          disabled={!fix.trim() || fix.trim() === tag}
                          style={{ ...S.btn('primary'), whiteSpace:'nowrap', opacity: (fix.trim() && fix.trim() !== tag) ? 1 : 0.4 }}>
                          Apply fix
                        </button>
                      </div>
                    ))}
                  </div>
                  <div>
                    {isIgnored ? (
                      <button onClick={() => setDismissed(prev => { const n = new Set(prev); n.delete(tag); return n; })}
                        style={{ ...S.btn('ghost'), fontSize:12, color:'#999' }}>Un-ignore</button>
                    ) : !applied && (
                      <button onClick={() => setDismissed(prev => new Set([...prev, tag]))}
                        style={{ ...S.btn('ghost'), fontSize:12, color:'#AAA' }}>Ignore</button>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
 
// ─── EXPORT TAB ───────────────────────────────────────────────────────────────
  
  // Helper: convert 2D array of rows into an .xlsx file buffer
function rowsToXlsxBuffer(rows, sheetName = 'Sheet1') {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  // Return an ArrayBuffer suitable for JSZip
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}
  
function ExportTab({ contentFiles, masterFile, masterRows, masterTagsToAdd, replacements, colIdx }) {
  const [exporting, setExporting] = useState(false);
  const [done,      setDone]      = useState(false);
 
  const affected = useMemo(() => {
    const s = new Set();
    contentFiles.forEach((f, i) => {
      f.tags.forEach((_, t) => { if (replacements.has(t)) s.add(i); });
    });
    return s.size;
  }, [contentFiles, replacements]);
 
  // Replacements that touch an existing master entry (will rename in place)
  const masterRenames = useMemo(() => {
    if (!masterFile) return [];
    const out = [];
    replacements.forEach((dest, from) => {
      if (dest === DELETE_SENTINEL) return;
      if (masterFile.tags.has(from)) out.push({ from, to: dest });
    });
    return out;
  }, [masterFile, replacements]);
 
  async function doExport() {
  setExporting(true); setDone(false);
  try {
    const zip = new JSZip();

    // ── Modified content sheets → XLSX ───────────────────────────────
    contentFiles.forEach(f => {
      const updated = applyReplacements(f.rows, colIdx, replacements);

      // Always export as .xlsx regardless of original format
      const baseName = f.name.replace(/\.(xlsx|xls|tsv|csv)$/i, '');
      const outName  = baseName + '.xlsx';

      const wbArray = rowsToXlsxBuffer(updated, 'Sheet1');
      zip.file('content/' + outName, wbArray);
    });

    // ── Updated master sheet → XLSX ─────────────────────────────────
    // 1. Rename existing master entries that were replaced
    const renamedInMaster = new Set();
    const updatedMaster = masterRows.map((row, ri) => {
      if (ri === 0) return [...row]; // header
      const masterTag = (row[MASTER_TAG_COL] || '').toString().trim();
      const dest = replacements.get(masterTag);
      if (dest && dest !== DELETE_SENTINEL) {
        renamedInMaster.add(dest);
        const newRow = [...row];
        newRow[MASTER_TAG_COL] = dest;
        return newRow;
      }
      return [...row];
    });

    // 2. Append tags added via Missing Tags tab
    masterTagsToAdd.forEach(({ tag, group }) => {
      if (renamedInMaster.has(tag)) return;
      const row = Array(Math.max(2, updatedMaster[0]?.length || 2)).fill('');
      row[MASTER_GROUP_COL] = group || '';
      row[MASTER_TAG_COL]   = tag;
      updatedMaster.push(row);
    });

    const masterChanged = masterTagsToAdd.length > 0 || replacements.size > 0;
    if (masterChanged) {
      const masterBase = (masterFile?.name || 'master').replace(/\.(xlsx|xls|tsv|csv)$/i, '');
      const masterName = masterBase + '.xlsx';
      const masterWbArray = rowsToXlsxBuffer(updatedMaster, 'Master');
      zip.file('master/' + masterName, masterWbArray);
    }

    // ── Build ZIP and download ───────────────────────────────────────
    const blob = await zip.generateAsync({ type: 'blob' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'latino-usa-tags-updated.zip';
    a.click();
    URL.revokeObjectURL(url);
    setDone(true);
  } catch (e) {
    alert('Export failed: ' + (e.message || e));
  }
  setExporting(false);
}
 
  const deletions = useMemo(() =>
    [...replacements.values()].filter(v => v === DELETE_SENTINEL).length,
    [replacements]
  );
 
  const stats = [
    ['📝', replacements.size - deletions, 'Pending replacements'],
    ['🗑', deletions,                      'Tags to delete'],
    ['📄', affected,                       'Sheets affected'],
    ['📦', contentFiles.length,            'Total content sheets'],
  ];
 
  return (
    <div style={{ maxWidth: 920, margin: '0 auto', padding: '36px 28px' }}>
      <h2 style={{ fontSize:22, fontWeight:800, marginBottom:6 }}>Export</h2>
      <p style={{ color:'#666', fontSize:14, marginBottom:24, lineHeight:1.5}}>
  Downloads a ZIP with all {contentFiles.length} updated content sheets as Excel files
  (<code style={{background:'#F0F0F0',padding:'1px 4px',borderRadius:3}}>.xlsx</code>) in a
  <code style={{background:'#F0F0F0',padding:'1px 4px',borderRadius:3}}>content/</code> folder.
  {(masterTagsToAdd.length > 0 || replacements.size > 0) && ' Your master sheet will also be updated — existing entries renamed in place, new entries appended at the bottom.'}
      </p>
 
      {/* Stats */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:14, marginBottom:28 }}>
        {stats.map(([icon, val, label]) => (
          <div key={label} style={{ ...S.card, textAlign:'center', padding:'20px 12px', marginBottom:0 }}>
            <div style={{ fontSize:26, marginBottom:4 }}>{icon}</div>
            <div style={{ fontSize:28, fontWeight:800, color: BRAND_DARK }}>{val}</div>
            <div style={{ color:'#888', fontSize:12 }}>{label}</div>
          </div>
        ))}
      </div>
 
      {/* Pending replacements list */}
      {replacements.size > 0 && (
        <div style={{ ...S.card, marginBottom:24 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:12 }}>
            All Pending Tag Changes
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
            {[...replacements.entries()].map(([from, to]) => {
              const isDeleted = to === DELETE_SENTINEL;
              return (
                <div key={from} style={{
                  display:'flex', alignItems:'center', gap:5,
                  background: isDeleted ? '#FBE9E7' : '#F8F6F2',
                  borderRadius:6, padding:'4px 10px', fontSize:12,
                }}>
                  <span style={{ fontFamily:'monospace', color:'#C62828', textDecoration:'line-through' }}>{from}</span>
                  {isDeleted
                    ? <span style={{ color:'#BF360C', fontWeight:700, fontSize:11 }}>deleted</span>
                    : <><span style={{ color:'#AAA' }}>→</span>
                       <span style={{ fontFamily:'monospace', color:'#2E7D32', fontWeight:600 }}>{to}</span></>
                  }
                </div>
              );
            })}
          </div>
        </div>
      )}
 
      {/* Master renames (existing entries being renamed) */}
      {masterRenames.length > 0 && (
        <div style={{ ...S.card, marginBottom:24 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>
            Master Sheet — Entries to Rename
          </div>
          <p style={{ color:'#888', fontSize:12, marginBottom:12 }}>
            These tags exist in your master and will be renamed in place (group preserved).
          </p>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'2px solid #ECEAE6' }}>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>Current master tag</th>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>→ Renamed to</th>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>Group</th>
              </tr>
            </thead>
            <tbody>
              {masterRenames.map(({ from, to }) => {
                const group = masterFile?.tags.get(from) || '';
                return (
                  <tr key={from} style={{ borderBottom:'1px solid #F2F0EC' }}>
                    <td style={{ padding:'7px 10px', fontFamily:'monospace', color:'#C62828', textDecoration:'line-through' }}>{from}</td>
                    <td style={{ padding:'7px 10px', fontFamily:'monospace', color:'#2E7D32', fontWeight:600 }}>{to}</td>
                    <td style={{ padding:'7px 10px', color:'#666' }}>{group || <span style={{ color:'#CCC' }}>—</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
 
      {/* New master tags */}
      {masterTagsToAdd.length > 0 && (
        <div style={{ ...S.card, marginBottom:24 }}>
          <div style={{ fontWeight:700, fontSize:14, marginBottom:4 }}>
            Master Sheet — New Entries to Append
          </div>
          <p style={{ color:'#888', fontSize:12, marginBottom:12 }}>
            These tags were not in your master and will be added as new rows at the bottom.
          </p>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
            <thead>
              <tr style={{ borderBottom:'2px solid #ECEAE6' }}>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>Tag (new master entry)</th>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>Group</th>
                <th style={{ textAlign:'left', padding:'6px 10px', fontWeight:700, color:'#555', fontSize:12 }}>Origin</th>
              </tr>
            </thead>
            <tbody>
              {masterTagsToAdd.map(({ tag, group, renamedFrom }) => (
                <tr key={tag} style={{ borderBottom:'1px solid #F2F0EC' }}>
                  <td style={{ padding:'7px 10px', fontFamily:'monospace', fontWeight:600, color:'#2E7D32' }}>{tag}</td>
                  <td style={{ padding:'7px 10px', color:'#666' }}>{group || <span style={{ color:'#CCC' }}>—</span>}</td>
                  <td style={{ padding:'7px 10px', fontSize:11, color:'#A0660A' }}>
                    {renamedFrom
                      ? <>✏️ renamed from <span style={{ fontFamily:'monospace', textDecoration:'line-through' }}>{renamedFrom}</span></>
                      : <span style={{ color:'#CCC' }}>new tag</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
 
      {done && (
        <div style={{ background:'#E8F5E9', color:'#1B5E20', padding:'14px 18px', borderRadius:9, marginBottom:20, fontSize:14, fontWeight:500 }}>
          ✅ Downloaded! Check your Downloads folder for <strong>latino-usa-tags-updated.zip</strong>
        </div>
      )}
 
      <button onClick={doExport} disabled={exporting}
        style={{ ...S.btn('primary'), fontSize:15, padding:'12px 28px', opacity: exporting ? 0.5 : 1 }}>
        {exporting ? '⏳ Preparing ZIP…' : '📦 Download All Updated Sheets'}
      </button>
    </div>
  );
}
 
// ─── BEFORE/AFTER PREVIEW TAB ────────────────────────────────────────────────
function PreviewTab({ contentFiles, colIdx, replacements, masterTagSet, allContentTags, onSetReplacement }) {
  const [selectedFile,  setSelectedFile]  = useState(0);
  const [showAll,       setShowAll]       = useState(false);
  const [editingTag,    setEditingTag]    = useState(null);  // tag string being edited inline
  const [editValue,     setEditValue]     = useState('');
 
  const file = contentFiles[selectedFile];
  const allTagsList = useMemo(() => allContentTags ? [...allContentTags.keys()].sort() : [], [allContentTags]);
 
  // Per-row, per-tag diff info
  const previewRows = useMemo(() => {
    if (!file) return [];
    return file.rows.slice(1).map((row, i) => {
      const original = row[colIdx] || '';
      const origTags = parseTags(original);
      if (!origTags.length) return null;
 
      // Tag-level info for the "before" side
      const tagInfos = origTags.map(tag => {
        const dest = replacements.get(tag);
        if (!dest)                  return { tag, status: 'unchanged', dest: null };
        if (dest === DELETE_SENTINEL) return { tag, status: 'deleted',  dest: null };
        return { tag, status: 'replaced', dest };
      });
 
      // Compute the actual "after" tag list (handles splits via parseTags on dest)
      const afterTags = [...new Set(
        origTags.flatMap(t => {
          const d = replacements.get(t);
          if (d === DELETE_SENTINEL) return [];
          if (!d) return [t];
          return parseTags(d); // split-friendly
        })
      )];
 
      const changed = tagInfos.some(ti => ti.status !== 'unchanged');
      return { rowIndex: i + 1, tagInfos, afterTags, changed };
    }).filter(Boolean);
  }, [file, colIdx, replacements]);
 
  const changedRows = previewRows.filter(r => r.changed);
  const visible     = showAll ? previewRows : changedRows;
 
  function openEdit(tag) {
    const pending = replacements.get(tag);
    setEditingTag(tag);
    setEditValue(pending && pending !== DELETE_SENTINEL ? pending : tag);
  }
 
  function applyEdit() {
    const val = editValue.trim();
    if (!val) return;
    onSetReplacement(editingTag, val);
    setEditingTag(null);
  }
 
  function applyDelete() {
    onSetReplacement(editingTag, DELETE_SENTINEL);
    setEditingTag(null);
  }
 
  function clearPending() {
    // Remove this tag's replacement by setting it back to itself (no-op replacement)
    // Actually just re-set to the original tag to clear
    onSetReplacement(editingTag, editingTag);
    setEditingTag(null);
  }
 
  if (!contentFiles.length) return (
    <div style={{ textAlign: 'center', padding: '60px 0', color: '#888' }}>Upload sheets first.</div>
  );
 
  const colLetter = String.fromCharCode(65 + colIdx);
  const colHdr    = contentFiles[0]?.rows[0]?.[colIdx];
  const colName   = colHdr ? `"${String(colHdr).trim()}" (col ${colLetter})` : `column ${colLetter}`;
 
  return (
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '32px 28px' }}>
      <h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Before / After Preview</h2>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 20 }}>
        See exactly how {colName} will look after all pending changes — click any tag to edit it inline.
      </p>
 
      {/* Toolbar */}
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 20, flexWrap: 'wrap' }}>
        <select value={selectedFile} onChange={e => { setSelectedFile(+e.target.value); setEditingTag(null); }}
          style={{ ...S.input, width: 'auto', minWidth: 220, fontWeight: 600 }}>
          {contentFiles.map((f, i) => (
            <option key={i} value={i}>{f.name.replace(/\.(csv|tsv|xlsx?)$/i, '')} ({
              f.rows.slice(1).filter(r => parseTags(r[colIdx] || '').some(t => replacements.has(t))).length
            } changes)</option>
          ))}
        </select>
        <button onClick={() => setShowAll(x => !x)} style={{ ...S.btn('ghost'), fontSize: 12, color: '#666' }}>
          {showAll ? 'Show changed rows only' : `Show all rows (${previewRows.length})`}
        </button>
        <span style={S.badge(changedRows.length ? 'orange' : 'green')}>
          {changedRows.length} row{changedRows.length !== 1 ? 's' : ''} will change
        </span>
        {/* Legend */}
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center', fontSize: 11, color: '#888' }}>
          <span style={{ background: '#FFEBEE', border: '1px solid #FFCDD2', borderRadius: 4, padding: '2px 7px', fontFamily: 'monospace', textDecoration: 'line-through', color: '#C62828' }}>removed</span>
          <span style={{ background: '#E8F5E9', border: '1px solid #C8E6C9', borderRadius: 4, padding: '2px 7px', fontFamily: 'monospace', color: '#2E7D32', fontWeight: 700 }}>added</span>
          <span style={{ background: '#F5F5F5', border: '1px solid #E0E0E0', borderRadius: 4, padding: '2px 7px', fontFamily: 'monospace', color: '#888' }}>unchanged</span>
        </div>
      </div>
 
      {visible.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '60px 0', color: '#888' }}>
          {changedRows.length === 0 ? '✅ No changes pending for this sheet.' : 'No rows match.'}
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {visible.map(({ rowIndex, tagInfos, afterTags, changed }) => {
            const isEditing = editingTag && tagInfos.some(ti => ti.tag === editingTag);
            return (
              <div key={rowIndex}>
                <div style={{
                  display: 'grid', gridTemplateColumns: '52px 1fr 1fr',
                  gap: 0, borderBottom: '1px solid #F2F0EC',
                  background: changed ? '#FFFDF8' : 'white',
                  borderLeft: changed ? `3px solid ${BRAND}` : '3px solid transparent',
                }}>
                  {/* Row number */}
                  <div style={{ padding: '10px 12px', color: '#BBB', fontSize: 11, fontWeight: 600, alignSelf: 'center' }}>
                    {rowIndex}
                  </div>
 
                  {/* Before — tag chips with change highlights */}
                  <div style={{ padding: '8px 12px', display: 'flex', flexWrap: 'wrap', gap: 5, alignItems: 'center', borderRight: '1px solid #F2F0EC' }}>
                    {tagInfos.map(({ tag, status, dest }) => {
                      const isBeingEdited = editingTag === tag;
                      return (
                        <span
                          key={tag}
                          onClick={() => { setEditingTag(isBeingEdited ? null : tag); setEditValue(dest && dest !== DELETE_SENTINEL ? dest : tag); }}
                          title="Click to edit"
                          style={{
                            fontFamily: 'monospace', fontSize: 11, padding: '3px 8px', borderRadius: 5,
                            cursor: 'pointer', transition: 'all .1s',
                            textDecoration: status === 'deleted' ? 'line-through' : status === 'replaced' ? 'line-through' : 'none',
                            background: isBeingEdited ? BRAND_LIGHT
                              : status === 'deleted'  ? '#FFEBEE'
                              : status === 'replaced' ? '#FFEBEE'
                              : '#F5F5F5',
                            border: `1px solid ${isBeingEdited ? BRAND : status === 'unchanged' ? '#E0E0E0' : '#FFCDD2'}`,
                            color: isBeingEdited ? BRAND_DARK
                              : status === 'deleted'  ? '#C62828'
                              : status === 'replaced' ? '#C62828'
                              : '#888',
                            fontWeight: isBeingEdited ? 700 : 400,
                          }}>
                          {tag}
                          {status === 'replaced' && dest && (
                            <span style={{ color: '#AAA', fontStyle: 'normal' }}> →</span>
                          )}
                        </span>
                      );
                    })}
                  </div>
 
                  {/* After — result chips */}
                  <div style={{ padding: '8px 12px', display: 'flex', flexWrap: 'wrap', gap: 5, alignItems: 'center' }}>
                    {afterTags.map(tag => {
                      const wasOriginal = tagInfos.some(ti => ti.tag === tag && ti.status === 'unchanged');
                      const inMaster    = masterTagSet && masterTagSet.has(tag);
                      return (
                        <span
                          key={tag}
                          onClick={() => { setEditingTag(tag === editingTag ? null : tag); setEditValue(tag); }}
                          title="Click to edit"
                          style={{
                            fontFamily: 'monospace', fontSize: 11, padding: '3px 8px', borderRadius: 5,
                            cursor: 'pointer', transition: 'all .1s',
                            background: wasOriginal ? '#F5F5F5' : inMaster ? BRAND_LIGHT : '#E8F5E9',
                            border: `1px solid ${wasOriginal ? '#E0E0E0' : inMaster ? BRAND : '#C8E6C9'}`,
                            color: wasOriginal ? '#888' : inMaster ? BRAND_DARK : '#2E7D32',
                            fontWeight: wasOriginal ? 400 : 600,
                          }}>
                          {tag}
                          {!wasOriginal && inMaster && <span style={{ marginLeft: 3, fontSize: 9 }}>★</span>}
                        </span>
                      );
                    })}
                  </div>
                </div>
 
                {/* Inline edit panel — shown directly below the row */}
                {isEditing && (
                  <div style={{
                    background: BRAND_LIGHT, border: `1.5px solid ${BRAND}`,
                    borderTop: 'none', padding: '12px 16px',
                    display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap',
                  }}>
                    <span style={{ fontSize: 12, color: BRAND_DARK, fontWeight: 700, whiteSpace: 'nowrap' }}>
                      ✏️ Editing: <code style={{ fontFamily: 'monospace' }}>{editingTag}</code>
                    </span>
                    <AutocompleteInput
                      value={editValue}
                      onChange={setEditValue}
                      onEnter={applyEdit}
                      masterTagSet={masterTagSet}
                      allTagsList={allTagsList}
                      placeholder="Replace with… (use | to split)"
                      style={{ ...S.input, fontFamily: 'monospace', fontSize: 12, fontWeight: 600, flex: '1 1 200px', minWidth: 160 }}
                    />
                    <button onClick={applyEdit}
                      disabled={!editValue.trim() || editValue.trim() === editingTag}
                      style={{ ...S.btn('primary'), fontSize: 12, padding: '6px 14px', whiteSpace: 'nowrap',
                        opacity: editValue.trim() && editValue.trim() !== editingTag ? 1 : 0.4 }}>
                      Apply →
                    </button>
                    {replacements.has(editingTag) && replacements.get(editingTag) !== DELETE_SENTINEL && (
                      <button onClick={clearPending}
                        style={{ ...S.btn('ghost'), fontSize: 12, padding: '6px 12px', color: '#888', whiteSpace: 'nowrap' }}>
                        Clear change
                      </button>
                    )}
                    <button onClick={applyDelete}
                      style={{ ...S.btn('danger'), fontSize: 12, padding: '6px 12px', whiteSpace: 'nowrap' }}>
                      Delete tag
                    </button>
                    <button onClick={() => setEditingTag(null)}
                      style={{ ...S.btn('ghost'), fontSize: 12, padding: '6px 10px', color: '#AAA' }}>
                      ✕
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}
 
// ─── CO-OCCURRENCE TAB ────────────────────────────────────────────────────────
function CooccurrenceTab({ contentFiles, colIdx }) {
  const [minCount, setMinCount] = useState(2);
  const [search,   setSearch]   = useState('');
 
  const pairs = useMemo(() => {
    const counts = new Map(); // "tagA|||tagB" -> count
    contentFiles.forEach(file => {
      file.rows.slice(1).forEach(row => {
        const tags = [...new Set(parseTags(row[colIdx] || ''))];
        for (let i = 0; i < tags.length; i++) {
          for (let j = i + 1; j < tags.length; j++) {
            const key = [tags[i], tags[j]].sort().join('|||');
            counts.set(key, (counts.get(key) || 0) + 1);
          }
        }
      });
    });
    return [...counts.entries()]
      .map(([key, count]) => { const [a, b] = key.split('|||'); return { a, b, count }; })
      .sort((x, y) => y.count - x.count);
  }, [contentFiles, colIdx]);
 
  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return pairs.filter(p => p.count >= minCount && (!q || p.a.toLowerCase().includes(q) || p.b.toLowerCase().includes(q)));
  }, [pairs, minCount, search]);
 
  return (
    <div style={{ maxWidth: 900, margin: '0 auto', padding: '32px 28px' }}>
      <h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Co-occurrence Patterns</h2>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 20 }}>
        Tag pairs that appear together in the same row. High co-occurrence may indicate tags that could be merged, or consistent tagging patterns worth preserving.
      </p>
 
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 20, flexWrap: 'wrap' }}>
        <input placeholder="Search tags…" style={{ ...S.input, width: 200 }}
          value={search} onChange={e => setSearch(e.target.value)} />
        <label style={{ fontSize: 13, color: '#555', display: 'flex', alignItems: 'center', gap: 8 }}>
          Min. co-occurrences:
          <input type="number" min={1} value={minCount} onChange={e => setMinCount(Math.max(1, +e.target.value))}
            style={{ ...S.input, width: 70 }} />
        </label>
        <span style={S.badge('blue')}>{filtered.length} pairs</span>
      </div>
 
      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '60px 0', color: '#888' }}>No co-occurring pairs match your filters.</div>
      ) : (
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead>
            <tr style={{ borderBottom: '2px solid #ECEAE6' }}>
              <th style={{ textAlign: 'left', padding: '9px 12px', fontWeight: 700, color: '#555' }}>Tag A</th>
              <th style={{ textAlign: 'left', padding: '9px 12px', fontWeight: 700, color: '#555' }}>Tag B</th>
              <th style={{ textAlign: 'left', padding: '9px 12px', fontWeight: 700, color: '#555' }}>Co-occurrences</th>
              <th style={{ padding: '9px 12px' }}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.slice(0, 200).map(({ a, b, count }) => (
              <tr key={`${a}|||${b}`} style={{ borderBottom: '1px solid #F2F0EC' }}>
                <td style={{ padding: '8px 12px', fontFamily: 'monospace', fontWeight: 600 }}>{a}</td>
                <td style={{ padding: '8px 12px', fontFamily: 'monospace', fontWeight: 600 }}>{b}</td>
                <td style={{ padding: '8px 12px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <div style={{ height: 8, width: Math.min(120, count * 4), background: BRAND, borderRadius: 4, opacity: 0.7 }} />
                    <span style={S.badge('orange')}>{count}</span>
                  </div>
                </td>
                <td style={{ padding: '8px 12px', textAlign: 'right' }}></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}
 
// ─── COVERAGE REPORT TAB ─────────────────────────────────────────────────────
function CoverageTab({ contentFiles, colIdx, masterTagSet }) {
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('coverage'); // 'coverage' | 'alpha'
 
  // All master tags + their presence per sheet
  const matrix = useMemo(() => {
    const tags = [...masterTagSet].sort();
    return tags.map(tag => {
      const presence = contentFiles.map(f => f.tags.has(tag));
      const count    = presence.filter(Boolean).length;
      return { tag, presence, count, pct: Math.round(count / contentFiles.length * 100) };
    });
  }, [masterTagSet, contentFiles]);
 
  const sorted = useMemo(() => {
    const q = search.toLowerCase();
    const filtered = matrix.filter(r => r.tag.toLowerCase().includes(q));
    return sortBy === 'alpha'
      ? [...filtered].sort((a, b) => a.tag.localeCompare(b.tag))
      : [...filtered].sort((a, b) => b.pct - a.pct);
  }, [matrix, search, sortBy]);
 
  return (
    <div style={{ maxWidth: 1100, margin: '0 auto', padding: '32px 28px' }}>
      <h2 style={{ fontSize: 22, fontWeight: 800, marginBottom: 6 }}>Sheet Coverage Report</h2>
      <p style={{ color: '#666', fontSize: 14, marginBottom: 20 }}>
        Which master tags appear in which sheets. Green = present, empty = absent.
      </p>
 
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', marginBottom: 20, flexWrap: 'wrap' }}>
        <input placeholder="Search tags…" style={{ ...S.input, width: 200 }}
          value={search} onChange={e => setSearch(e.target.value)} />
        <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ ...S.input, width: 'auto' }}>
          <option value="coverage">Sort by coverage %</option>
          <option value="alpha">Sort alphabetically</option>
        </select>
        <span style={S.badge('blue')}>{sorted.length} tags</span>
      </div>
 
      <div style={{ overflowX: 'auto' }}>
        <table style={{ borderCollapse: 'collapse', fontSize: 11, minWidth: '100%' }}>
          <thead>
            <tr style={{ borderBottom: '2px solid #ECEAE6' }}>
              <th style={{ textAlign: 'left', padding: '8px 12px', fontWeight: 700, color: '#555', minWidth: 180, position: 'sticky', left: 0, background: '#FFF', zIndex: 1 }}>Tag</th>
              <th style={{ textAlign: 'center', padding: '8px 8px', fontWeight: 700, color: '#555', minWidth: 60 }}>Coverage</th>
              {contentFiles.map((f, i) => (
                <th key={i} style={{ textAlign: 'center', padding: '6px 4px', fontWeight: 600, color: '#777', minWidth: 28, maxWidth: 36, fontSize: 10, writingMode: 'vertical-rl', transform: 'rotate(180deg)', height: 80, overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {f.name.replace(/\.(csv|tsv|xlsx?)$/i, '')}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sorted.map(({ tag, presence, pct }) => (
              <tr key={tag} style={{ borderBottom: '1px solid #F2F0EC' }}>
                <td style={{ padding: '5px 12px', fontFamily: 'monospace', fontWeight: 600, fontSize: 12, position: 'sticky', left: 0, background: '#FFF' }}>{tag}</td>
                <td style={{ padding: '5px 8px', textAlign: 'center' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 4, justifyContent: 'center' }}>
                    <div style={{ width: 40, height: 6, background: '#EEE', borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ width: `${pct}%`, height: '100%', background: pct === 100 ? '#2E7D32' : pct > 50 ? BRAND : '#EF9A9A', borderRadius: 3 }} />
                    </div>
                    <span style={{ fontSize: 10, color: '#888' }}>{pct}%</span>
                  </div>
                </td>
                {presence.map((has, i) => (
                  <td key={i} style={{ textAlign: 'center', padding: '5px 4px', background: has ? '#E8F5E9' : 'transparent', fontSize: 12 }}>
                    {has ? '✓' : ''}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}
